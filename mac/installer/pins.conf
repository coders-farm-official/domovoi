# What the Mac side downloads, pinned by URL and SHA-256 (mac-installer
# PLAN 4.11). KEY=value lines; `#` starts a comment. Read by DomovoiMacKit
# (Pins.swift); domovoi/tests/test_mac_pins.py holds the Ollama lines to the
# Linux pin and to the core's minimum.
#
# A download that doesn't match its SHA-256 is deleted and the install stops.
# Bump these only in a Mac-side release, with the Mac tests run again.

# Lima: limactl and its arm64 guest agent. Bundled in the package from Phase 3
# on; the user-mode helper downloads it. The digest is the release's own
# SHA256SUMS line for this file.
LIMA_VERSION=2.2.1
LIMA_URL=https://github.com/lima-vm/lima/releases/download/v2.2.1/lima-2.2.1-Darwin-arm64.tar.gz
LIMA_SHA256=9e9eacce88f37e185c346bad73aa6136f738d8cdf8c3bb23cd42b071824bc66e

# Ollama: the standalone darwin tarball (not the app), the same release as the
# Linux pin (docs/LINUX_HOST.md OLLAMA_VERSION). Digest from the GitHub release.
OLLAMA_VERSION=0.34.4
OLLAMA_URL=https://github.com/ollama/ollama/releases/download/v0.34.4/ollama-darwin.tgz
OLLAMA_SHA256=e9c8fddaab5f48f47f2c4ae3d23d0732f5182417125353faeed2188e34a22799
# The oldest Ollama the household may bring ("use the Ollama already on this
# Mac"): the core's MIN_OLLAMA_VERSION (domovoi/clients/ollama.py).
OLLAMA_MIN_VERSION=0.12.7

# The VM's Ubuntu 26.04 arm64 cloud image, a dated release folder.
UBUNTU_IMAGE_URL=https://cloud-images.ubuntu.com/releases/resolute/release-20261016/ubuntu-26.04-server-cloudimg-arm64.img
UBUNTU_IMAGE_SHA256=8eb876c2ccc4b6ff89e4a65d511815923b285e04503ba465809bf587f763da24

# Speech recognition on the Mac's graphics chip (mac-installer PHASE8A-STT.md).
# mac/build.sh builds whisper-server from this whisper.cpp tag (the commit is
# checked after the clone; the source is never copied into this repository)
# and ships the binary in the package; the install downloads the model and
# runs it as com.domovoi.mac.stt on 127.0.0.1:6371. Delete these lines and
# the package installs no speech service: the core then recognises speech on
# the VM's processor, as on Windows.
WHISPERCPP_VERSION=1.9.5
WHISPERCPP_COMMIT=d1be6fde11ac6e0407606b4e42fe72d34add8037
# OpenAI's small.en in ggml f16, from whisper.cpp's model repository at a
# fixed commit (Hugging Face API: lfs.sha256 and size).
STT_MODEL_NAME=small.en
STT_MODEL_URL=https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-small.en.bin
STT_MODEL_SHA256=c6138d6d58ecc8322097e0f987c32f1be8bb0a18532a3f88f734d1bbf9c41e5d
STT_MODEL_BYTES=487614201
