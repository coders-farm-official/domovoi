# Accepted vulnerabilities for .github/workflows/osv.yml (OSV-Scanner).
#
# The job fails on ANY known vulnerability in the lock files it scans. An
# advisory that does not apply to us, or that can't be fixed yet, goes here
# instead of being left to fail every run, and only with:
#   id           the advisory's id as the scanner prints it (GHSA-, PYSEC-,
#                CVE-...); one entry covers its aliases too
#   ignoreUntil  a date, at most about two months out: the entry stops
#                counting then and the job fails again, so every acceptance
#                gets looked at again (renew it only after checking)
#   reason       why it is safe: what the advisory needs, and why we don't
#                meet it
# Never ignore something that has a fixed version we can take: bump the lock.
# docs/CONTRIBUTING.md ("CI", "Dependencies") says how.
