# `cuda`, `voice-profile`, `fingerprint`, `shazam`, `chat`). Their wheels
# differ per platform and GPU, so pinning them from one machine would break
# installs on the next; install them with pip's own resolver as documented
# in the README and docs/CPU_HOST.md.
#
