[project]
name = "domovoi"
version = "1.0.0"
description = "Domovoi — the home computer system that just works: media, files, rooms, voice and optional AI, all at home"
requires-python = ">=3.11"
# Floors are the lowest versions the code is known to work with AND, for
# the packages that parse untrusted input (starlette, python-multipart,
# requests, urllib3, pillow), the first release of the fixed line — do not lower
# them. Floors are all pip's resolver honours: a server installed by
# docs/LINUX_HOST.md "Install" gets exact, hash-checked versions from
# `requirements-linux-py314.lock`, but its update unit re-syncs from that lock
# only once the owner opts in (DOMOVOI_USE_LOCK=1); otherwise, and on any
# other Python, an update resolves within these floors from the index,
# unchecked (docs/SECURITY_PRIVACY.md, "Uploads and dependencies").
# `requirements.lock` is the test suite's set (Python 3.12, with `dev`), not a
# deployment's; both locks are regenerated as docs/CONTRIBUTING.md says.
dependencies = [
    "fastapi>=0.115",
    # Direct floor on the ASGI toolkit fastapi builds on (fastapi's own
    # floor is lower): multipart and form parsing live here.
    "starlette>=0.40",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Lightweight clients — kept in core so the real-clients extra only
    # carries the heavy ML/audio deps.
    "ollama>=0.3",
    # The MPD control protocol is spoken by domovoi/clients/mpd_protocol.py
    # (no python-mpd2, LGPL-3.0, since 2026-10-15).
    # Multipart form parsing for the web dashboard's file uploads (Voices
    # page uploads Piper .onnx models). Required by FastAPI's UploadFile.
    "python-multipart>=0.0.18",
    # CalculatorHandler uses simpleeval for arithmetic — sandboxed AST
    # evaluation, never builtin eval/exec. Tiny pure-Python dep, kept
    # in core so the handler doesn't gate on an optional extra.
    "simpleeval>=0.9",
    # Documents suite (web/backend/api/documents.py) homegrown editors:
    # .xlsx round-trip for the spreadsheet grid and .docx export from
    # markdown docs. Both pure-Python with wheels everywhere.
    "openpyxl>=3.1",
    "python-docx>=1.1",
    # Documents in Chat (domovoi/doc_extract): pypdfium2 (Apache-2.0 or
    # BSD-3-Clause; its PDFium is BSD-style, with FreeType under the
    # FreeType licence) reads a PDF's text page by page, in a capped worker
    # process. The printing branch pins the same version for drawing pages.
    "pypdfium2>=5.14",
    # Host hardware readout for the Models page (/v1/admin/hardware): CPU
    # load, RAM, and model-storage disk free. GPUs come from nvidia-smi
    # (no dep). Small, pure-wheel on Windows; in core so the hardware
    # endpoint imports cleanly. Degrades gracefully if somehow absent.
    "psutil>=5.9",
    # requests: small and pure-Python, so it lives in core rather than an
    # extra (the satellite sync clients and the feed paths use it).
    "requests>=2.32",
    # Direct floor on the HTTP library requests builds on (requests' own
    # floor is lower): 2.8.0 fixes the streaming-decompression and
    # proxy-TLS advisories of 2026 (PYSEC-2026-4175/4176/4177). requests
    # carries every fetch the satellite sync clients and feed paths make.
    "urllib3>=2.8",
    # Admin-password hashing (argon2id) for the admin_auth table. Ships in
    # core from 1.0.0 even though the auth endpoints land after the DB
    # baseline — the dependency and the schema arrive together so no
    # intermediate install is ever missing it.
    "argon2-cffi>=23.1",
    # Library-image thumbnails (web/backend/api/images.py): Pillow resize →
    # WebP cache in S–XL buckets. Pure-wheel on Windows; the endpoint
    # degrades to 204/no-thumbs if it were somehow absent.
    "pillow>=10.4",
    # Co-editing (web/backend/collab): pycrdt (MIT), the Python binding of
    # the Yrs CRDT, speaks the same Yjs update format as the browsers.
    # abi3 wheels from CPython 3.11 (cp314 included), x86_64 and aarch64.
    "pycrdt>=0.14.10,<0.15",
    # Printing (domovoi/printing/): pypdfium2 (Apache-2.0 or BSD-3-Clause;
    # its PDFium is BSD-style, the FreeType inside it under the FreeType
    # licence, credited in docs/LICENSES.md) draws pages for printers that
    # don't take PDF, the print previews and the page counts; ReportLab
    # (BSD) draws the test page, text/markdown and table printouts and the
    # scan PDFs. Binary wheels for every platform incl. cp314 / pure Python.
    "pypdfium2>=5.14",
    "reportlab>=5.0",
    # Direct dependency for the chat-stream helper (clients/ollama.py) and
    # other httpx call sites (was already transitive via the ollama client).
    "httpx>=0.27",
    # Spoken-name matching for music (handlers/shared/spoken_names.py and
    # library_match.py: "play suicide boys" finds $uicideboy$). rapidfuzz
    # (MIT; binary wheels for every CPython incl. cp314 manylinux) scores
    # spellings; anyascii (ISC, pure Python) transliterates names to ASCII
    # — NOT unidecode, which is GPL; Metaphone (BSD, pure Python, published
    # as an sdist only) gives Double Metaphone sounds-alike keys. Number
    # words are written by hand (spoken_names.int_to_words), not num2words
    # (LGPL).
    "rapidfuzz>=3.14",
    "anyascii>=0.3.3",
    "Metaphone>=0.6",
]

[project.urls]
Homepage = "https://github.com/coders-farm-official/domovoi"

[project.scripts]
# The plugin dev CLI (design §3.8): domovoi plugin new/dev/pack.
domovoi = "domovoi.plugins_runtime.cli:main"

[project.optional-dependencies]
# Real Whisper/TTS clients. Skipped when USE_STUBS=true (tests, CI).
# Install with: pip install -e ".[real-clients]"  (or ".[dev,real-clients]").
real-clients = [
    # Speech recognition: faster-whisper itself is installed without its
    # declared dependencies (requirements-no-deps.in: it declares PyAV,
    # which bundles FFmpeg's LGPL libraries, and Domovoi never has it
    # decode a file). These are the dependencies it does use, with its own
    # bounds (faster-whisper 1.x); onnxruntime is below.
    "ctranslate2>=4.0,<5",
    "huggingface-hub>=0.21",
    "tokenizers>=0.13,<1",
    "tqdm",
    # No edge-tts (LGPL-3.0) or miniaudio (its MP3 decoding) since
    # 2026-10-12: the Microsoft Edge online voices were dropped, and the
    # update unit uninstalls edge-tts from existing venvs
    # (scripts/linux/apply-update.sh, RETIRED_PACKAGES).
    # The Piper voices run directly on ONNX Runtime (MIT), fed by Domovoi's
    # own text-to-phoneme converter (domovoi/phonemizer, which also runs
    # its small out-of-dictionary model on it). Not piper-tts: since 1.3 it
    # is GPL-3.0 and carries espeak-ng (GPL-3.0); the update unit uninstalls
    # it from existing venvs (scripts/linux/apply-update.sh). 1.28 is the
    # floor, not 1.20 (which runs it): the out-of-dictionary model's near
    # ties come out the same on 1.28 and newer, the phone's runtime, and
    # can differ on 1.24 (domovoi/phonemizer/README.md, the golden fixture).
    "onnxruntime>=1.28",
    "numpy>=1.26",
    # No lameenc (LGPL-3.0, carrying LAME) since 2026-10-15: the satellite
    # clips (canned_sounds.py) are encoded to MP3 by the system ffmpeg, run
    # as its own program, as ffprobe and fpcalc already are.
    # No mutagen (GPL-2.0-or-later) since 2026-10-15: the tags inside audio
    # files (the indexers, cover art, lyrics, podcast chapters) are read by
    # Domovoi's own reader, domovoi/media_tags.
    # Library enricher (workers/library_enricher.py). pyacoustid wraps
    # Chromaprint via the `fpcalc` binary (must be on PATH — see
    # domovoi/README.md "Library enrichment setup"). Pure Python.
    # NOTE: shazamio — the second-stage fallback — is deliberately NOT
    # here; see the `shazam` extra below.
    "pyacoustid>=1.3",
    # Podcast RSS parsing for the feed poller (workers/podcast_feed_poller.py).
    # Pure-Python, no build step. Only the (network) feed-poll path imports it
    # — downloaded-episode playback works without it, matching the handler's
    # `degraded` contract.
    "feedparser>=6.0",
]
# Shazam fallback for the library enricher — the second stage, used only for
# tracks AcoustID's catalog doesn't cover. Its own extra, and NOT part of
# `real-clients`, for two reasons:
#
#  1. Its compiled core (`shazamio-core`) publishes wheels for a narrow set
#     of Python versions. On anything else pip builds it from Rust source,
#     which needs a toolchain plus `pkg-config` and `libasound2-dev`.
#  2. Worse, a source build is not necessarily a working build: on CPython
#     3.14 the resulting extension SEGFAULTS at import (observed 2026-09-01,
#     shazamio-core 1.1.2 on Ubuntu 26.04). `_enrich_via_shazam` imports it
#     lazily behind `except ImportError`, but a segfault is not an exception
#     — it takes the whole core process down, and the enricher worker would
#     retry into a crash loop.
#
# The enricher degrades cleanly when it's absent ("shazamio not installed;
# skipping Shazam layer") and keeps working on AcoustID alone. Install it
# only if `shazamio-core` ships a real wheel for your Python:
#
#   pip install -e ".[shazam]"
shazam = [
    "shazamio>=0.7",
]
# CUDA runtime for Whisper. Split out of `real-clients` so a CPU-only or
# non-NVIDIA host (see docs/CPU_HOST.md) doesn't pull ~2-3 GB of wheels it
# will never load. Install alongside real-clients on an NVIDIA box:
#
#   pip install -e ".[real-clients,cuda]"
#
# On Windows these wheels are effectively required — `domovoi/bootstrap.py`
# preloads their DLLs because the Windows loader won't resolve ctranslate2's
# dependent DLLs on its own. On Linux they're optional if CUDA is already
# installed system-wide; installing them anyway is the reliable path.
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]
# The streaming fast lane (domovoi/fast_lane.py, fastlane_mode=shadow): a
# small streaming recognizer that follows each command while it is spoken.
# Off by default, and an install without it runs exactly as before (shadow
# mode then logs once that the lane is unavailable). It runs on sherpa-onnx,
# which this project no longer installs: the sherpa-onnx wheels on PyPI
# (and sherpa-onnx-core under them) compile in espeak-ng, GPL-3.0, for
# their own text to speech (checked 2026-10-12 on 1.13.8). An owner who
# wants the lane installs a sherpa-onnx built with SHERPA_ONNX_ENABLE_TTS=OFF
# (docs/CPU_HOST.md, "The fast lane"), or the PyPI wheel knowing what it
# carries. The model (a 103 MB download, 137 MB unpacked) arrives on first
# enable, from a pinned URL checked against a pinned SHA-256.
# VoiceProfileHandler runtime deps: torch, which runs Resemblyzer's speaker
# encoder (domovoi/clients/speaker_encoder.py). Resemblyzer itself is
# installed without its dependencies, for its weights alone:
#
#   pip install -e ".[real-clients,voice-profile]"
#   pip install --no-deps -r requirements-no-deps.in
#
# Not librosa (since 2026-10-15): it brought soxr and soundfile (LGPL
# libraries) and numba for one mel spectrogram, which speaker_encoder.py
# computes with numpy; nor webrtcvad, whose sdist needs a compiler.
voice-profile = [
    "torch>=2.0",
]
# Local-library fingerprinting. The fingerprint client uses a
# scipy-STFT-based landmark hash modeled on the Shazam algorithm —
# computes a spectrogram, picks peaks, hashes pairs of peaks within a
# target window. Outputs land in our own ``library_track_fingerprints``
# table (binary BYTEA + a HASH index), so we don't need a
# separate fingerprint DB or a third-party dejavu/audfprint backend.
# The audio is decoded by the system ffmpeg (no librosa since 2026-10-15:
# it brought soxr and soundfile, LGPL libraries); `numpy` and `scipy` run
# the algorithm.
fingerprint = [
    "numpy>=1.26",
    "scipy>=1.11",
]
# Conversational chat mode (#8). The Letta SDK client used by
# domovoi/clients/letta.py to drive the self-hosted Letta agent.
# Split into its own extra because chat mode is opt-in and server-gated
# (settings.chat_mode_enabled, OFF by default) — a deployment that never
# enables chat mode doesn't need this dep at all. Tests don't need it
# either: USE_STUBS / chat_mode_enabled=False route to LettaStubClient,
# which has no third-party import. Install only for chat mode with:
#   pip install -e ".[chat]"  (or ".[dev,real-clients,chat]")
chat = [
    # Lower bound = a known-good baseline; pin the exact version validated
    # during the live Letta+Ollama spike. <1 guards the 0.x SDK's API drift.
    "letta-client>=0.1,<1",
]
# Ed25519 for the per-install server identity satellites pin
# (domovoi/server_identity.py): the signed /v1/health challenge and the
# signed code / plugin-payload manifests.
#
# An EXTRA rather than a core dependency, for the same reason the hardware
# extras are: `cryptography` is a speed-up, not a requirement. The identity
# layer falls back to the vendored pure implementation in
# domovoi/_ed25519.py — same keys, same signatures — which is what a 32-bit
# Pi OS (no aarch64 wheel, no Rust toolchain) and the test environment
# actually run on. Locking it in requirements.lock (OPS-5) would claim it is
# part of the tested set, and it is not: the suite runs the vendored path.
#
#   pip install -e ".[signing]"
signing = [
    "cryptography>=42.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # `pytest -n N` (pytest-xdist, MIT; its execnet is MIT too): the suite
    # on N worker processes, each on its own copy of the test database
    # (domovoi/tests/xdist_db.py). requirements.lock pins the exact version.
    "pytest-xdist>=3.8",
    "httpx>=0.27",
    # The suite imports these directly (library enricher + identify-chain
    # tests exercise the real modules with stubbed I/O), so a plain
    # `pip install -e ".[dev]"` must be enough to run pytest.
    "numpy>=1.26",
    "pyacoustid>=1.3",
    # The phonemizer's golden fixture runs its out-of-dictionary model
    # (domovoi/tests/test_phonemizer_golden.py), on the runtime a server and
    # the phone run (the real-clients floor, below).
    "onnxruntime>=1.28",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["domovoi*", "web*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["domovoi/tests", "plugins/radio/tests", "satellite/tests"]
markers = [
    "spoken_gate: the spoken-name resolver on the frozen held-out audit set (opt-in, DOMOVOI_SPOKEN_GATE_DIR); it measures and never tunes",
    "bash_harness: runs a whole scripts/linux/tests harness under the host's bash (minutes to an hour on Git Bash); deselected under pytest -n, where scripts/dev/run-linux-harness.sh runs them instead",
    "xdist_group(name): under pytest -n, tests of one group run on one worker, one at a time (they share something outside the process: Postgres roles, a fixed temp file); see domovoi/tests/conftest.py",
]
