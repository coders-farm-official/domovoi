# The fresh-install test: a real install of the Domovoi server on each
# supported Linux server system, in a throwaway KVM virtual machine on
# GitHub's hosted runner (they have /dev/kvm), then an update and a
# rollback through the update unit. scripts/dev/linux-install-vm.sh does
# the work and says what it checks; docs/CONTRIBUTING.md, "The
# fresh-install test", says how to read a run and how to run it by hand.
#
#   ubuntu-26.04  Ubuntu Server 26.04's cloud image: the venv on the
#                 system's python3 (the Windows installer's distro is the
#                 same system; its own path is the harnesses' to test)
#   debian-13     Debian 13's genericcloud image: the venv on Domovoi's own
#                 CPython (scripts/linux/python-runtime.sh)
# Linux Mint 22 and Pop!_OS 24.04 install as Ubuntu 24.04 (noble) and have
# no cloud image to boot here; the provision harness covers their mapping.
#
# When: weekly (Monday 04:17 UTC, so a moved archive or a pulled pin shows
# up without a commit), by hand from the Actions tab (on any branch: run
# it there before a change to the Linux scripts goes to main), and on a
# push to main that changes what it tests (the Linux scripts, the locks,
# this file). Not on every push: a run takes about 8 minutes a system.
#
# Least privilege: the token reads the repository and nothing else; no
# secrets; every action pinned by commit SHA (the comment names its
# release; to move one, look up the new release's commit and replace both,
# picking a release at least two weeks old).
name: linux-install

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/linux/**"
      - "requirements-linux-py314*"
      - "scripts/dev/linux-install-vm.sh"
      - ".github/workflows/linux-install.yml"

# A newer push to the same branch makes an older run moot.
concurrency:
  group: linux-install-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: fresh install (${{ matrix.system }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        system: [ubuntu-26.04, debian-13]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The test makes its update commits on top of HEAD, and the box's
          # update verifier mirrors the whole history, as on a real box.
          fetch-depth: 0
      - name: KVM, QEMU and room for the VM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils genisoimage
          sudo mkdir -p /mnt/linux-install
          sudo chown "$(id -u):$(id -g)" /mnt/linux-install
          df -h / /mnt
      - name: scripts/dev/linux-install-vm.sh ${{ matrix.system }}
        run: bash scripts/dev/linux-install-vm.sh "${{ matrix.system }}" --work /mnt/linux-install
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-install-${{ matrix.system }}
          path: /mnt/linux-install/logs/
          if-no-files-found: ignore
          retention-days: 14
