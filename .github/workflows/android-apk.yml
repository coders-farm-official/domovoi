# Build an installable debug APK for the Android app and publish it as a
# workflow artifact. Runs on any push/PR that touches android/, and can be
# fired by hand from the Actions tab (workflow_dispatch) when you just want
# an APK of the current branch.
#
# The APK is debug-signed with the runner's throwaway debug keystore, a new
# key on every run: fine for sideloading a test build, but it is NOT a
# release. Android refuses to install it over a build signed with any other
# key (another CI run, Android Studio), so upgrading means uninstalling, and
# that loses the app's saved servers and household token. Its SHA-256 goes
# into the run summary. A release-signed APK is built locally from a key you
# keep: android/README.md, "Release-signed builds".
#
# Every action is pinned by commit SHA (the comment names the release that
# commit was), so a moved tag can't change what builds the APK. To move one:
# look up the new release's commit and replace both.
name: android-apk

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

# The job only reads the repository; the artifact upload uses the runner's
# own token, not GITHUB_TOKEN scopes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Record the APK's SHA-256
        run: |
          {
            echo "### Debug APK (debug-signed, not a release)"
            echo '```'
            sha256sum app/build/outputs/apk/debug/app-debug.apk
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: domovoi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
