# Continuous integration: every pull request into main, every push to main,
# and by hand from the Actions tab (workflow_dispatch, which runs every job
# whatever changed). main takes changes only through pull requests, and a
# pull request merges only once the `ci passed` job below is green (owner
# decision 2026-11-17; docs/CONTRIBUTING.md, "Pull requests"). The repo is
# public, so GitHub's standard hosted runners cost nothing (owner decision
# 2026-11-14). docs/CONTRIBUTING.md, "CI", says what runs and how to read a
# red run.
#
# Jobs, and what starts them (the `changes` job decides from the pushed
# commits' files; anything it can't tell runs everything):
#   docs     every push: the documentation gates (privacy, licences, version
#            copies, mermaid, the manual) and the workflow pins.
#   python   any change beyond docs: the whole pytest suite (core, radio
#            plugin, satellite), split into shards, each on its own Postgres.
#   web      any change beyond docs: the .jsx compile + duplicate globals,
#            and web/openapi.json and the manual's content file up to date.
#   harness  scripts/linux/ changed: the bash harnesses in their pinned
#            Linux containers (scripts/dev/run-linux-harness.sh all).
#   android  the app or a file its build reads changed: unit tests and a
#            debug APK (artifact `domovoi-debug-apk`; debug-signed, a test
#            build, not a release: android/README.md "Release-signed builds").
#   android-repro-build, android-repro-compare  the same: the unsigned
#            release APKs built twice in the pinned image (android/build-env),
#            two different ways, and compared byte for byte (diffoscope's
#            report as an artifact when they differ). android/README.md,
#            "Reproducible builds". Only when a file the release APK is
#            built from changed (android_apk).
#   android-release-rehearsal  then: release.ps1 -SkipBuild -NoPublish on
#            windows-2025 signs leg a's APKs with a throwaway key made in the
#            job and checks them (apksigcopier included); nothing published.
#   windows  windows/ (or a file its tests read) changed: build.ps1, the C#
#            unit tests, and the installer when Inno Setup is on the runner.
#   ios      ios/ (or a workflow) changed: the iPhone app's package tests on
#            macOS and the app + UI-test target compiled for the Simulator,
#            unsigned (the Simulator UI trains stay on the owner's Mac).
#   mac      mac/ (or a workflow) changed: the Mac server's package
#            (swift build && swift test in mac/) on macOS with a pinned
#            Xcode. Started by hand (Run workflow), it also builds the whole
#            installer the way release.yml's build-mac job does (mac/build.sh,
#            a development build, nothing published), so the release's
#            build is proven before release day.
#   sbom     any change beyond docs: the release's three SBOMs
#            (scripts/release/sbom.py, the app's through Gradle), made the
#            way release.yml makes them, so a release never finds them
#            broken. An artifact (`domovoi-sboms`), never published.
#   ci-ok    after all of the above: one result for the branch rule to
#            require ("ci passed"). Green when every job passed or was
#            skipped because nothing it checks changed.
# A new job slots into `jobs:` beside these, and into ci-ok's `needs`.
#
# No secrets anywhere, and none may be added: release signing and publishing
# stay on the owner's PC with the owner's keys. Every action is pinned by
# commit SHA (the comment names the release that commit was), so a moved
# tag can't change what runs; to move one, look up the new release's commit
# and replace both (pick a release at least two weeks old).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref makes the older run moot.
# On main every push gets its own complete run (two sessions push there, and
# a cancelled run leaves a commit with no result); elsewhere a newer push
# replaces the older run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job only reads the repository; artifact uploads use the runner's own
# token, not GITHUB_TOKEN scopes.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12" # requirements.lock is the suite's set, for Python 3.12
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      harness: ${{ steps.filter.outputs.harness }}
      android: ${{ steps.filter.outputs.android }}
      # For the reproducibility jobs: what goes into the release APK changed.
      android_apk: ${{ steps.filter.outputs.android_apk }}
      windows: ${{ steps.filter.outputs.windows }}
      # For the ios job: ios/ or this workflow changed.
      ios: ${{ steps.filter.outputs.ios }}
      # For the mac job: mac/ or a workflow changed.
      mac: ${{ steps.filter.outputs.mac }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          # A pull request compares its base with the merge GitHub tests.
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          all() { for k in code harness android android_apk windows ios mac; do echo "$k=true"; done >>"$GITHUB_OUTPUT"; echo "running every job: $1"; }
          if [ "$EVENT" != push ] && [ "$EVENT" != pull_request ]; then all "started by $EVENT"; exit 0; fi
          case "$BEFORE" in ''|0000000000000000000000000000000000000000) all "no previous commit to compare with"; exit 0 ;; esac
          if ! git fetch -q --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then
            all "the previous commit $BEFORE is not fetchable (force push?)"; exit 0
          fi
          git diff --name-only "$BEFORE" "$AFTER" >"$RUNNER_TEMP/changed.txt"
          echo "changed files:"; sed 's/^/  /' "$RUNNER_TEMP/changed.txt"
          has() { grep -qE "$1" "$RUNNER_TEMP/changed.txt" && echo true || echo false; }
          # Docs-only: Markdown anywhere, pictures under docs/. Everything
          # else (docs/uml's JSON fixtures, say) is code to some test.
          code=$(grep -qvE '(\.md$|^LICENSE$|^docs/.*\.(png|jpe?g|gif|svg|webp)$)' "$RUNNER_TEMP/changed.txt" && echo true || echo false)
          {
            echo "code=$code"
            echo "harness=$(has '^(scripts/linux/|scripts/dev/(run-linux-harness\.sh|.*harness\.Dockerfile)$|\.github/workflows/)')"
            # The app's build and tests read beyond android/
            # (android/app/build.gradle.kts: the phonemizer, voice clips,
            # drafts, docs/uml fixtures, the manual, satellite_media).
            echo "android=$(has '^(android/|domovoi/|docs/uml/|web/static/manual-content\.json$|\.github/workflows/)')"
            # What the release APK is built from (android/app/build.gradle.kts:
            # voiceAssets, manualAssets, draftAssets), the build image, the
            # line-ending rules, and this workflow: two clean builds each.
            echo "android_apk=$(has '^(android/|domovoi/(phonemizer|voice_clips|drafts|doc_qa)/|web/static/manual-content\.json$|\.gitattributes$|\.github/workflows/ci\.yml$)')"
            # build.ps1's tests read domovoi/lan_name/vectors.json.
            echo "windows=$(has '^(windows/|domovoi/lan_name/|\.github/workflows/)')"
            echo "ios=$(has '^(ios/|\.github/workflows/)')"
            echo "mac=$(has '^(mac/|\.github/workflows/)')"
          } >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  docs:
    name: docs gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # No database here: these tests read files only. The URL just has to
      # satisfy the conftest's guard; nothing listens on port 1.
      TEST_DATABASE_URL: postgresql+asyncpg://domovoi:domovoi@127.0.0.1:1/domovoi_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (requirements.lock, hash-checked)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: The manual's content file is built from its source
        run: python scripts/manual/build_manual.py --check
      - name: Docs gates
        run: |
          python -m pytest -p no:cacheprovider -q \
            domovoi/tests/test_repo_privacy.py \
            domovoi/tests/test_docs_mermaid.py \
            domovoi/tests/test_manual_content.py \
            domovoi/tests/test_manual_weak_spots.py \
            domovoi/tests/test_licences_doc.py \
            domovoi/tests/test_dependency_licences.py \
            domovoi/tests/test_shipped_font_licences.py \
            domovoi/tests/test_version_copies.py \
            domovoi/tests/test_ops_ci_workflow.py

  ruff:
    name: ruff (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # ruff alone (exact version and hashes in .github/ci-ruff-requirements.txt);
      # the rules are pyproject.toml's [tool.ruff]. Lint only, no formatter.
      - name: Install ruff (pinned, hash-checked)
        run: python -m pip install --require-hashes -r .github/ci-ruff-requirements.txt
      - name: Lint (any finding fails the job)
        run: ruff check --no-fix .

  python:
    name: pytest ${{ matrix.shard }}/6
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      # The dev compose file's Postgres (domovoi/docker-compose.yml), by
      # digest. Each shard's job has its own; the workers' copies
      # (pytest -n) are made from it by domovoi/tests/xdist_db.py.
      postgres:
        image: postgres:16.15-trixie@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_DB: domovoi_test
          POSTGRES_USER: domovoi
          POSTGRES_PASSWORD: domovoi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U domovoi -d domovoi_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Port 5432, not the live install's 6432, so no opt-in is needed
      # (domovoi/tests/db_guard.py).
      TEST_DATABASE_URL: postgresql+asyncpg://domovoi:domovoi@127.0.0.1:5432/domovoi_test
      # Red on NEW failures only: a failure listed in
      # domovoi/tests/known_failures.toml is still printed, but exits 0.
      DOMOVOI_FAIL_ON_NEW_ONLY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      # The suite and the web checks run JavaScript under Node (the
      # dashboard's render harnesses, scripts/dev/jsxcheck.js); some of it
      # needs a newer Node than the runner image's default.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: System tools some tests use (ffmpeg; tesseract for the scan reader's real OCR test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng >/dev/null
      - name: Install (requirements.lock, hash-checked)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      # Two imports the suite makes that requirements.lock (core + dev)
      # doesn't carry: scipy (BSD) for the satellite's resampler
      # (satellite/requirements.txt), feedparser (BSD, with its sgmllib3k)
      # for the podcast and news feed readers (the real-clients extra).
      # Exact versions and hashes in .github/ci-extra-requirements.txt.
      # The rest of real-clients (Whisper, ONNX voices) stays out: the
      # suite runs on stubs.
      - name: Install what the tests import beyond the lock (scipy, feedparser)
        run: python -m pip install --require-hashes -r .github/ci-extra-requirements.txt
      # Voice ID's speaker model (25 MB), from the pinned URL and checked
      # against the pinned SHA-256 the server uses
      # (domovoi/clients/speaker_encoder.py), so test_speaker_encoder.py
      # runs its embedding tests (the ONNX Runtime guard) instead of skipping.
      - name: Voice ID's speaker model (pinned), for the encoder's tests
        run: |
          sha=$(python -c "from domovoi.clients import speaker_encoder as se; print(se.MODEL_SHA256)")
          for url in $(python -c "from domovoi.clients import speaker_encoder as se; print(*se.MODEL_URLS)"); do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/speaker.onnx" "$url"               && echo "$sha  $RUNNER_TEMP/speaker.onnx" | sha256sum -c - && break
            echo "::warning::speaker model not fetched from $url"
            rm -f "$RUNNER_TEMP/speaker.onnx"
          done
          test -s "$RUNNER_TEMP/speaker.onnx"
          echo "DOMOVOI_TEST_SPEAKER_MODEL=$RUNNER_TEMP/speaker.onnx" >>"$GITHUB_ENV"
      # The default 100 connections run out under pytest -n 4 (each worker
      # has its own database copy and the app's pools): raise it, then
      # restart the service container so the setting takes.
      - name: More database connections for the parallel workers
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U domovoi -d domovoi_test -c "ALTER SYSTEM SET max_connections = 500"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do
            docker exec ${{ job.services.postgres.id }} pg_isready -h 127.0.0.1 -U domovoi -d domovoi_test && break
            sleep 1
          done
      - name: Migrate the test database (Flyway, as the compose file's flyway-test)
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/domovoi/db/migrations:/flyway/sql:ro" \
            flyway/flyway:10.22.0@sha256:43592cc125eb0594d9b013e8dced2fa67d473c091abaa5dec03b22f49e682949 \
            -url=jdbc:postgresql://127.0.0.1:5432/domovoi_test -user=domovoi -password=domovoi \
            -connectRetries=20 migrate
      - name: The database is there (no requires_db test may skip quietly)
        run: |
          python - <<'EOF'
          import asyncio, asyncpg
          async def main():
              c = await asyncpg.connect("postgresql://domovoi:domovoi@127.0.0.1:5432/domovoi_test")
              n = await c.fetchval("SELECT count(*) FROM flyway_schema_history WHERE success")
              await c.close()
              assert n > 0, "no migrations applied"
              print(f"domovoi_test: {n} migrations applied")
          asyncio.run(main())
          EOF
      - name: Pick this shard's test files
        run: |
          python scripts/dev/ci_shard.py --summary 6
          python scripts/dev/ci_shard.py ${{ matrix.shard }} 6 >"$RUNNER_TEMP/shard.txt"
          echo "$(wc -l <"$RUNNER_TEMP/shard.txt") files in shard ${{ matrix.shard }}"
      - name: pytest -n 4
        run: |
          mkdir -p .test-results
          xargs -a "$RUNNER_TEMP/shard.txt" -d '\n' \
            python -m pytest -n 4 -p no:cacheprovider -q -ra --durations=15 \
              --junitxml=".test-results/junit-${{ matrix.shard }}.xml"
      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-junit-${{ matrix.shard }}
          path: .test-results/junit-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: web (jsx, openapi, manual)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: The .jsx compile, and no duplicate top-level names (vendored Babel)
        run: node scripts/dev/jsxcheck.js
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (requirements.lock, hash-checked)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: web/openapi.json is up to date (python -m web.scripts.dump_openapi)
        run: |
          python -m web.scripts.dump_openapi
          git diff --stat --exit-code -- web/openapi.json \
            || { echo "::error file=web/openapi.json::out of date: run python -m web.scripts.dump_openapi and commit it"; exit 1; }
      - name: web/static/manual-content.json is up to date (scripts/manual/build_manual.py)
        run: |
          python scripts/manual/build_manual.py
          git diff --stat --exit-code -- web/static/manual-content.json \
            || { echo "::error file=web/static/manual-content.json::out of date: run python scripts/manual/build_manual.py and commit it"; exit 1; }

  harness:
    name: bash harnesses
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: scripts/dev/run-linux-harness.sh all
        run: bash scripts/dev/run-linux-harness.sh all
      - name: Upload the harness logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-harness-logs
          path: .test-results/linux-harness/
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # 21, not 17: the unit tests load LiteRT-LM's classes on the JVM
          # (NoNetworkTest), and its jar is built for Java 21 (class files
          # version 65). The app itself still targets Java 17. The exact
          # Temurin the release build image has (android/build-env/Dockerfile).
          java-version: "21.0.13+9"
      # Caches Gradle's downloads and validates the wrapper jar. The runner
      # image's Android SDK (ANDROID_HOME) has its licences accepted, so the
      # Android Gradle plugin fetches any platform it lacks by itself.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Unit tests and the debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Record the APK's SHA-256
        run: |
          {
            echo "### Debug APK (debug-signed, not a release)"
            echo '```'
            sha256sum app/build/outputs/apk/debug/app-debug.apk
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: domovoi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload the unit-test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  # Reproducible release APKs (android/README.md, "Reproducible builds"):
  # the same commit, built twice in the pinned image (android/build-env) in
  # two environments that differ in everything that mustn't matter, must
  # give byte-identical unsigned APKs. That is what lets F-Droid publish the
  # owner-signed APK: its own build of the commit has to match it.
  #   a  the image's defaults: UTC, C.UTF-8, umask 022, every core, Temurin,
  #      the checkout at /build/domovoi.
  #   b  Pacific/Kiritimati (UTC+14), tr_TR.UTF-8 (dotted/dotless i), umask
  #      077, two cores, Ubuntu's OpenJDK 21 instead of Temurin, the checkout
  #      at /tmp/x/y/src.
  # Each leg builds each ABI alone, as F-Droid does and as the release does
  # (build-apks.sh).
  # Each leg has a fresh Gradle home and no build cache. No secrets: these
  # APKs are unsigned and stay CI artifacts.
  android-repro-build:
    name: android repro build ${{ matrix.leg }}
    needs: changes
    if: needs.changes.outputs.android_apk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        leg: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src-${{ matrix.leg }}
      - name: The build image, and what it holds is android/build-env/BUILD-ENV.txt
        env:
          LEG: ${{ matrix.leg }}
        run: |
          docker build -q -t domovoi-android-build-env "src-$LEG/android/build-env" >/dev/null
          docker run --rm domovoi-android-build-env cat /etc/domovoi-build-env.txt >"$RUNNER_TEMP/env.txt"
          if ! grep -v '^#' "src-$LEG/android/build-env/BUILD-ENV.txt" | diff -u - "$RUNNER_TEMP/env.txt"; then
            echo "::error file=android/build-env/BUILD-ENV.txt::the image installs something else than BUILD-ENV.txt says: move the pin in both"
            exit 1
          fi
      - name: Build the unsigned release APKs (leg ${{ matrix.leg }})
        env:
          LEG: ${{ matrix.leg }}
        run: |
          mkdir -p out
          if [ "$LEG" = a ]; then
            docker run --rm \
              -v "$PWD/src-a:/build/domovoi" -v "$PWD/out:/out" \
              domovoi-android-build-env \
              bash -c 'umask 022; exec bash /build/domovoi/android/build-env/build-apks.sh /build/domovoi /out'
          else
            jdk=/usr/lib/jvm/java-21-openjdk-amd64
            docker run --rm --cpuset-cpus 0-1 \
              -e TZ=Pacific/Kiritimati -e LANG=tr_TR.UTF-8 -e LC_ALL=tr_TR.UTF-8 \
              -e JAVA_HOME="$jdk" -e PATH="$jdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              -v "$PWD/src-b:/tmp/x/y/src" -v "$PWD/out:/out" \
              domovoi-android-build-env \
              bash -c 'umask 077; exec bash /tmp/x/y/src/android/build-env/build-apks.sh /tmp/x/y/src /out'
          fi
          # The container wrote as root (leg b with umask 077): the runner's
          # user uploads them.
          sudo chown -R "$(id -u):$(id -g)" out
          {
            echo "### Unsigned release APKs, leg $LEG"
            echo '```'
            (cd out && find . -name '*.apk' | LC_ALL=C sort | xargs sha256sum)
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-repro-${{ matrix.leg }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  android-repro-compare:
    name: android repro compare
    needs: android-repro-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: android-repro-*
          path: repro
      - name: The two legs' APKs are byte for byte the same
        id: compare
        run: |
          set -u
          cd repro
          bad=0
          : >"$RUNNER_TEMP/pairs.txt"
          {
            echo "### Reproducible build: leg a against leg b"
            echo '| APK | SHA-256 | same |'
            echo '|---|---|---|'
          } >>"$GITHUB_STEP_SUMMARY"
          for abi in arm64-v8a armeabi-v7a; do
            f="app-$abi-release-unsigned.apk"
            left="android-repro-a/$f"; right="android-repro-b/$f"
            if [ -f "$left" ] && [ -f "$right" ] && cmp -s "$left" "$right"; then
              echo "| $f | \`$(sha256sum "$left" | cut -c1-64)\` | yes |" >>"$GITHUB_STEP_SUMMARY"
            else
              echo "| $f | | **NO** |" >>"$GITHUB_STEP_SUMMARY"
              echo "::error::$f differs between leg a and leg b"
              echo "$left $right" >>"$RUNNER_TEMP/pairs.txt"
              bad=1
            fi
            if ! cmp -s "android-repro-a/mapping-$abi.txt" "android-repro-b/mapping-$abi.txt"; then
              echo "::warning::R8's mapping-$abi.txt differs between the legs (it is not in the APK)"
            fi
          done
          if cmp -s android-repro-a/mapping-arm64-v8a.txt android-repro-a/mapping-armeabi-v7a.txt; then
            echo "R8's mapping is the same for both ABIs." >>"$GITHUB_STEP_SUMMARY"
          fi
          echo "bad=$bad" >>"$GITHUB_OUTPUT"
      - name: What differs (zip entries, then diffoscope)
        if: steps.compare.outputs.bad == '1'
        run: |
          cd repro
          mkdir -p ../report
          while read -r left right; do
            [ -f "$left" ] && [ -f "$right" ] || { echo "missing: $left or $right"; continue; }
            python3 - "$left" "$right" <<'PY' | tee -a ../report/entries.txt
          import hashlib, sys, zipfile
          a, b = (zipfile.ZipFile(p) for p in sys.argv[1:3])
          print(f"== {sys.argv[1]} vs {sys.argv[2]}")
          ia = {i.filename: i for i in a.infolist()}
          ib = {i.filename: i for i in b.infolist()}
          if list(ia) != list(ib):
              print("entry order or set differs:", sorted(set(ia) ^ set(ib)) or "(order only)")
          for name in ia:
              if name not in ib:
                  continue
              x, y = ia[name], ib[name]
              da, db = hashlib.sha256(a.read(name)).hexdigest(), hashlib.sha256(b.read(name)).hexdigest()
              meta = [k for k in ("compress_type", "date_time", "external_attr", "extra", "header_offset") if getattr(x, k) != getattr(y, k)]
              if da != db or meta:
                  print(f"{name}: {'content' if da != db else ''} {' '.join(meta)}")
          PY
          done <"$RUNNER_TEMP/pairs.txt"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends diffoscope-minimal >/dev/null
          n=0
          while read -r left right; do
            n=$((n + 1))
            [ -f "$left" ] && [ -f "$right" ] || continue
            timeout 900 diffoscope --html "../report/diff-$n.html" --text "../report/diff-$n.txt" \
              --max-report-size 20000000 "$left" "$right" || true
            head -c 20000 "../report/diff-$n.txt" || true
          done <"$RUNNER_TEMP/pairs.txt"
          exit 1
      - name: Upload the difference report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-repro-diff
          path: report/
          if-no-files-found: ignore
          retention-days: 14

  # The signing half of a release, rehearsed on the runner release.yml signs
  # on (windows-2025, the same JDK, SDK and apksigcopier steps) with leg a's
  # unsigned APKs and a throwaway key made here: android/scripts/release.ps1
  # -SkipBuild -NoPublish signs them (--alignment-preserved), runs
  # apksigcopier compare with the SDK's apksigner.bat, and the server's own
  # check. No environment, no secrets, nothing pushed or published.
  android-release-rehearsal:
    name: android release rehearsal (throwaway key)
    needs: android-repro-build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out without line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Android SDK and JDK 17 (the runner's, as release.yml)
        shell: pwsh
        run: |
          if (-not $env:JAVA_HOME_17_X64) { throw 'no JDK 17 on the runner (JAVA_HOME_17_X64)' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "JAVA_HOME=$env:JAVA_HOME_17_X64" -Encoding utf8
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (-not (Test-Path -LiteralPath $sdkmanager)) { throw "no sdkmanager at $sdkmanager" }
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          $yes = ('y' + [Environment]::NewLine) * 20
          $yes | & $sdkmanager --licenses | Out-Null
          & $sdkmanager 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'sdkmanager failed' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-repro-a
          path: android/app/build/outputs/apk/release
      - name: apksigcopier 1.1.1 (pinned, hash-checked, as release.yml)
        shell: bash
        run: |
          cat >"$RUNNER_TEMP/apksigcopier.txt" <<'REQ'
          apksigcopier==1.1.1 --hash=sha256:0834bb7d6f3607bb0994cf8cd2e26b8f0c9d481e13b75872e0fa9cec052e519b
          click==8.4.2 --hash=sha256:e6f9f66136c816745b9d65817da91d61d957fb16e02e4dcd0552553c5a197b76
          REQ
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: \
            -r "$RUNNER_TEMP/apksigcopier.txt"
          scripts="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')"
          echo "$scripts" >>"$GITHUB_PATH"
          "$scripts/apksigcopier" --version
      - name: Sign with a throwaway key, check, write the manifest (release.ps1 -SkipBuild -NoPublish)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # A local commit, never pushed: android/release.json names no
          # release, so the throwaway key isn't held to the release key. The
          # APKs are its parent's build; it changes only that file.
          git config user.name 'release rehearsal'
          git config user.email 'rehearsal@example.invalid'
          $doc = Get-Content -Raw -Encoding UTF8 'android\release.json' | ConvertFrom-Json
          $doc.release = $null
          [IO.File]::WriteAllText((Join-Path $PWD 'android\release.json'), ($doc | ConvertTo-Json -Depth 10) + "`n", (New-Object Text.UTF8Encoding $false))
          git commit -q -am 'rehearsal: no release (never pushed)'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          $out = 'android\app\build\outputs\apk\release'
          $null = New-Item -ItemType Directory -Force -Path 'android\app\build\outputs\mapping\release'
          Move-Item -LiteralPath (Join-Path $out 'mapping.txt') -Destination 'android\app\build\outputs\mapping\release\mapping.txt'
          [IO.File]::WriteAllText((Join-Path $PWD "$out\COMMIT"), "$(git rev-parse HEAD)`n", (New-Object Text.UTF8Encoding $false))
          # The throwaway key: made here, gone with the runner.
          $ks = Join-Path $env:RUNNER_TEMP 'rehearsal.jks'
          & (Join-Path $env:JAVA_HOME 'bin\keytool.exe') -genkeypair -keystore $ks -alias rehearsal -keyalg RSA -keysize 2048 `
            -validity 2 -storepass rehearsal -keypass rehearsal -dname 'CN=Domovoi release rehearsal'
          if ($LASTEXITCODE -ne 0) { throw 'keytool failed' }
          $cred = New-Object System.Management.Automation.PSCredential('k', (ConvertTo-SecureString 'rehearsal' -AsPlainText -Force))
          & .\android\scripts\release.ps1 -SkipBuild -NoPublish -Keystore $ks -Alias rehearsal -KeystoreCredential $cred
          if ($LASTEXITCODE -ne 0) { throw "release.ps1 exited $LASTEXITCODE" }
          Get-Content -Raw 'android\app\build\outputs\apk\release-signed\release.json'

  windows:
    name: windows
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell # Windows PowerShell 5.1, as build.ps1 expects
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build.ps1 -SkipInstaller (the exes and the C# unit tests)
        run: .\windows\build.ps1 -SkipInstaller
      # The installer too when the runner image has Inno Setup 6, so a
      # broken .iss shows up here. Built, not uploaded: it is unsigned and
      # carries the pinned release commit (installer\pins.iss), not this one.
      - name: The installers compile (Inno Setup 6, when the runner has it)
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            Write-Output "::notice::Inno Setup 6 is not on this runner image; the installer build was skipped"
            exit 0
          }
          .\windows\build.ps1 -SkipTests -Iscc $iscc

  # The iPhone app (owner decision 2026-11-14: "Build + package tests"):
  # the DomovoiKit and DomovoiPhonemizer package tests on macOS, and the app
  # plus its UI-test target compiled for the Simulator, unsigned. The
  # Simulator UI trains stay on the owner's Mac: they need the stub house
  # (ios/README.md). Nothing here signs anything or holds a secret.
  ios:
    name: ios
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The newest Xcode on the image: the project needs Swift 6 and the iOS 18
      # SDK or later; FoundationModels is behind canImport, so an older SDK
      # still builds.
      - name: Pick the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Package tests (DomovoiKit)
        working-directory: ios/Packages/DomovoiKit
        run: swift test
      # DomovoiPhonemizer has no test target of its own (its tests run in
      # DomovoiKit's), so here it is only built.
      - name: Package builds (DomovoiPhonemizer)
        working-directory: ios/Packages/DomovoiPhonemizer
        run: swift build
      - name: XcodeGen
        run: brew install xcodegen
      - name: The app and its UI tests compile for the Simulator (unsigned)
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild build-for-testing \
            -project Domovoi.xcodeproj -scheme Domovoi \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1 && rc=0 || rc=$?
          # Every compile error first (a long log hides them above any tail),
          # then the end of the log.
          grep -E "(error|fatal error):" "$RUNNER_TEMP/build.log" | sort -u | head -n 80 || true
          tail -n 60 "$RUNNER_TEMP/build.log"
          exit "$rc"

  # The Mac server (mac/, docs/CONTRIBUTING.md "CI"): the SwiftPM package's
  # build and tests on macOS, with the Xcode release.yml's build-mac job
  # uses, picked by its path (never "whatever is newest"). Nothing here
  # signs anything or holds a secret.
  mac:
    name: mac
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode 16.4 (pinned; the same as release.yml's build-mac)
        run: |
          xcode=/Applications/Xcode_16.4.app
          [ -d "$xcode" ] || { echo "::error::no $xcode on this image: move the pin here and in release.yml"; ls -d /Applications/Xcode_*.app; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: swift build && swift test
        working-directory: mac
        run: swift build && swift test
      # Run by hand only (Actions, ci, Run workflow): the whole installer,
      # as release.yml's build-mac job builds it, minus the tag (a
      # development build of this commit). Proves mac/build.sh, its pinned
      # downloads and the build-path check on a runner; the package is
      # thrown away with the runner.
      - name: The installer, as the release builds it (by hand only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          bash mac/build.sh --out "$RUNNER_TEMP/mac" --repo-url "https://github.com/$GITHUB_REPOSITORY" --cmake pinned 2>&1 | tee "$RUNNER_TEMP/mac-build.log"
          ls -l "$RUNNER_TEMP/mac"
          # Without --tag the build-path check only warns; here it fails.
          if grep -q "hold build paths" "$RUNNER_TEMP/mac-build.log"; then
            echo "::error::the programs hold build paths (see the note above)"; exit 1
          fi

  # The release's SBOMs, made as release.yml's sbom job makes them (no
  # cache, the runner's JDK 17, the wrapper's Gradle held to its SHA-256),
  # so a broken generator shows up here and not on release day.
  sbom:
    name: sbom
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The server's and the web's SBOMs
        run: |
          mkdir -p "$RUNNER_TEMP/sboms"
          python3 scripts/release/sbom.py server --out "$RUNNER_TEMP/sboms/domovoi-server.cdx.json"
          python3 scripts/release/sbom.py web --out "$RUNNER_TEMP/sboms/domovoi-web.cdx.json"
      - name: The app's SBOM
        working-directory: android
        run: |
          set -euo pipefail
          props=gradle/wrapper/gradle-wrapper.properties
          grep -qF gradle-8.14.3-bin.zip "$props"             || { echo "::error::the wrapper moved off Gradle 8.14.3: update its pinned SHA-256 here and in release.yml"; exit 1; }
          grep -qF distributionSha256Sum "$props"             || echo 'distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531' >>"$props"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --init-script ../scripts/release/sbom-android.init.gradle             -Pdomovoi.sbomDeps="$RUNNER_TEMP/gradle-deps.json" :app:domovoiSbomDeps
          python3 ../scripts/release/sbom.py android --gradle-deps "$RUNNER_TEMP/gradle-deps.json"             --out "$RUNNER_TEMP/sboms/domovoi-android.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: domovoi-sboms
          path: ${{ runner.temp }}/sboms/
          if-no-files-found: error
          retention-days: 14

  # The one check the branch rule on main requires. Every other job is listed
  # in `needs`; skipped is fine (nothing it checks changed), anything else
  # fails this job and so the pull request.
  ci-ok:
    name: ci passed
    if: always()
    needs: [changes, docs, ruff, python, web, harness, android, android-repro-build, android-repro-compare, android-release-rehearsal, windows, ios, mac, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] not in ("success", "skipped")}
          if bad:
              print("not passed:", ", ".join(f"{k}={v}" for k, v in sorted(bad.items())))
              sys.exit(1)
          print("every job passed or was skipped")
          '
