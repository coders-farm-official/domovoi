# OpenSSF Scorecard (owner decision for 1.3.0): checks the repository's
# supply-chain practices (pinned dependencies, token permissions, branch
# protection, signed releases and more), publishes the result to
# scorecard.dev (the README's badge and the public viewer) and uploads the
# findings to the Security tab (code scanning).
#
# Runs on main only: every push, weekly, and when branch protection
# changes (GitHub runs schedule and branch_protection_rule from the
# default branch). No secret, no personal access token: the run's own
# token, read-only except the two writes the job needs.
#
# Publishing has rules of its own (ossf/scorecard-action's README,
# "Workflow Restrictions"): no top-level env or defaults, no write
# permission at the top, id-token only in this job, no job env, defaults,
# containers or services, an Ubuntu hosted runner, and only these actions
# in the job: actions/checkout, actions/upload-artifact,
# github/codeql-action/upload-sarif, ossf/scorecard-action (and
# step-security/harden-runner). Keep it that way, or scorecard.dev refuses
# the result and the run fails. Every action is pinned by commit SHA (the
# comment names its release), as in the other workflows.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write        # the OIDC token scorecard.dev checks the published result against
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # The SARIF in the run's artifacts too, for five days.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
