# Configuration comes from the environment; this file holds only the
# things that are the same in every deployment.
#
# Scooped keeps no application.properties at all and reads everything
# through Environment/@Value. That works, but it also means nobody can
# see the knobs without grepping the source. These are the settings that
# are genuinely constant, plus documented defaults for the ones that are
# not; every secret still comes from the environment and none is here.

server.port=${SERVER_PORT:8080}
spring.application.name=ltl-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ltldb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ltluser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ltlpass}

# The schema is owned by ltl-db/init.sql, never by Hibernate. `validate`
# makes a drift between the entities and the database fail at startup
# instead of silently at the first query — and makes it impossible for a
# stray annotation to ALTER a production table.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Virtual threads: the relay holds one socket per household, mostly idle.
# Platform threads would put a hard ceiling on households per JVM for no
# reason other than stack allocation.
spring.threads.virtual.enabled=true

# WebSocket frames carry a sealed application frame plus the outer
# header. 4 MiB matches MAX_INNER_BYTES on the Python side.
ltl.relay.max-frame-bytes=${LTL_RELAY_MAX_FRAME_BYTES:4456448}
ltl.relay.heartbeat-seconds=${LTL_RELAY_HEARTBEAT_SECONDS:30}
ltl.relay.usage-flush-millis=${LTL_RELAY_USAGE_FLUSH_MILLIS:30000}

# Pairing window, and the per-IP budget on the unauthenticated enroll
# endpoint.
ltl.enrollment.ttl-minutes=${LTL_ENROLLMENT_TTL_MINUTES:15}
ltl.enrollment.max-per-ip-per-hour=${LTL_ENROLLMENT_MAX_PER_IP_PER_HOUR:20}

# Days a past_due subscription keeps working before the tunnel closes.
ltl.billing.grace-days=${LTL_BILLING_GRACE_DAYS:7}

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.secure-cookies=${APP_SECURE_COOKIES:false}

stytch.project-id=${STYTCH_PROJECT_ID:}
stytch.project-secret=${STYTCH_PROJECT_SECRET:}
stytch.public-token=${STYTCH_PUBLIC_TOKEN:}

stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

springdoc.swagger-ui.path=/swagger-ui.html
