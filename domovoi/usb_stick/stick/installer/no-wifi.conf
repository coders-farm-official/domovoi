# Domovoi room stick (domovoi/usb_stick/): Wi-Fi off in the installer.
# Every Wi-Fi driver needs cfg80211; with it refused, none loads, the
# installer sees only the cable port, and the stick's ERASE page says "plug
# in a network cable" before anything is erased. Left out of a stick made
# with Wi-Fi on (USB_STICK_WIFI=true on the Domovoi server).
install cfg80211 /bin/false
