# Tests that fail on origin/main for a known reason. pytest labels each
# failure in its summary as "known" (listed here) or "NEW" (not), and puts
# both counts in its last line (domovoi/tests/known_failures.py). Listing a
# test changes nothing else: it still fails, prints its traceback and makes
# the run's exit status non-zero.
#
# Kept by whoever integrates a batch into main: add a test when main is
# known to fail it (with why, and the first commit it was seen on), drop it
# when the fix lands. The summary says "passed ... take it off" for an entry
# that matched no failure in a run where the test passed.
#
# One [[failure]] table per test:
#   test   = pytest node id as the summary prints it, relative to the repo
#            root; "*" matches any run of characters, nothing else is special
#   reason = why it fails, in a line
#   since  = the commit of origin/main it was first recorded on

[[failure]]
test = "domovoi/tests/test_library_cover_art.py::test_same_tier_as_the_library_listing"
reason = "route lookup trips on how this FastAPI version nests included routers (sometimes passes)"
since = "eb4a497"

