# MPD configuration for the Domovoi server.
# Runs inside Docker — no host audio — so the only output is an HTTP stream
# that Pi satellites consume. Domovoi talks to MPD via the
# control port (6600) only.

music_directory     "/music"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/database"
state_file          "/var/lib/mpd/state"
sticker_file        "/var/lib/mpd/sticker.sql"
# Container-friendly logging: omit log_file so mpd --no-daemon writes to stderr,
# which Docker captures as `docker compose logs mpd`. Verbose level surfaces
# the encoder/httpd startup details we need when stream playback misbehaves.
log_level           "verbose"

bind_to_address     "0.0.0.0"
port                "6600"

# Auto-update the DB on filesystem changes.
auto_update         "yes"

# HTTP stream output for Pi satellites. No ALSA / Pulse.
# Port 8001 — 6370 is the Domovoi server's FastAPI port on the host.
audio_output {
    type        "httpd"
    name        "domovoi-http-stream"
    encoder     "lame"
    port        "8001"
    bind_to_address "0.0.0.0"
    bitrate     "192"
    format      "44100:16:2"
    always_on   "yes"
    tags        "yes"
}

# Null output so MPD doesn't crash when nobody's connected to the HTTP stream
# and there's no other output available.
audio_output {
    type        "null"
    name        "null-sink"
    mixer_type  "software"
}
