<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — Cash Currency display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 22px 24px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; }
  .row .name { color: var(--fg-muted); font-size: 11px; width: 64px; font-family: var(--ff-mono); }
  .row .meta { color: var(--fg-faint); font-size: 11px; font-family: var(--ff-mono); margin-left: auto; }
  .display { font-family: var(--ff-display); }
  .note { font-size: 11px; color: var(--fg-muted); padding-top: 6px; border-top: 1px solid var(--border-soft); margin-top: 8px; }
</style>
</head>
<body>
  <div class="row"><div class="name">display 32</div><div class="display" style="font-size:32px; letter-spacing:-0.01em">$1,420.00 — kitchen</div><div class="meta">Cash Currency · 32</div></div>
  <div class="row"><div class="name">display 24</div><div class="display" style="font-size:24px">39.0 / 72.2 Mbit</div><div class="meta">--ff-display · 24</div></div>
  <div class="row"><div class="name">display 18</div><div class="display" style="font-size:18px">0123456789 · $€¥</div><div class="meta">numerals + currency</div></div>
  <div class="note">Display slot — uploaded brand face. Use sparingly for marquee numbers; body and mono stay Inter / JetBrains Mono.</div>
</body>
</html>
