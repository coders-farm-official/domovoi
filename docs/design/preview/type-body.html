<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — body & meta</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px 24px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; }
  .row .name { color: var(--fg-muted); font-size: 11px; width: 64px; font-family: var(--ff-mono); }
  .row .meta { color: var(--fg-faint); font-size: 11px; font-family: var(--ff-mono); margin-left: auto; }
</style>
</head>
<body>
  <div class="row"><div class="name">md</div><div style="font-size:15px">Now playing in kitchen</div><div class="meta">15 / 400</div></div>
  <div class="row"><div class="name">sm</div><div class="body">Last heard Kamron 2m ago in the kitchen.</div><div class="meta">13 / 400 — body</div></div>
  <div class="row"><div class="name">xs</div><div class="meta">last connected 2026-05-08 13:00</div><div class="meta">11 / 400</div></div>
  <div class="row"><div class="name">label</div><div class="label">last heard</div><div class="meta">11 / 500</div></div>
  <div class="row"><div class="name">eyebrow</div><div class="eyebrow">satellites</div><div class="meta">11 / 500 / +4% upper</div></div>
</body>
</html>
