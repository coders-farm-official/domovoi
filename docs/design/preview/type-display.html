<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px 24px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; }
  .row .name { color: var(--fg-muted); font-size: 11px; width: 64px; font-family: var(--ff-mono); }
  .row .meta { color: var(--fg-faint); font-size: 11px; font-family: var(--ff-mono); margin-left: auto; }
</style>
</head>
<body>
  <div class="row"><div class="name">2xl</div><div class="h1">Three satellites online</div><div class="meta">32 / 600 / -2%</div></div>
  <div class="row"><div class="name">xl</div><div class="h2">Three satellites online</div><div class="meta">24 / 600 / -1.5%</div></div>
  <div class="row"><div class="name">lg</div><div class="h3">Three satellites online</div><div class="meta">18 / 600 / -1%</div></div>
</body>
</html>
