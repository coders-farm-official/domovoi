<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadow scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; align-items: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .card { width: 130px; height: 76px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--inner-highlight); }
  .name { font-family: var(--ff-mono); font-size: 11px; color: var(--fg-muted); }
  .desc { font-size: 11px; color: var(--fg-faint); }
</style>
</head>
<body>
  <div class="col"><div class="card" style="box-shadow: var(--shadow-xs), var(--inner-highlight)"></div><div class="name">--shadow-xs</div><div class="desc">hover lift</div></div>
  <div class="col"><div class="card" style="box-shadow: var(--shadow-sm), var(--inner-highlight)"></div><div class="name">--shadow-sm</div><div class="desc">popovers</div></div>
  <div class="col"><div class="card" style="box-shadow: var(--shadow-md), var(--inner-highlight)"></div><div class="name">--shadow-md</div><div class="desc">⌘K · modal</div></div>
</body>
</html>
