<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget=resizes-content: the on-screen keyboard shrinks
       the page (and 100dvh, styles.css --app-h) instead of covering its
       bottom, so the chat composer and the phone's tab strip stay above
       it (Chrome on Android; browsers that don't know it ignore it). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Domovoi Web</title>
  <script>
  /* The keyboard in a browser that lays it OVER the page (Safari on iOS,
   * and any without interactive-widget): the visual viewport is shorter
   * than the window by the height it covers. While a text field has the
   * focus and the page isn't pinch-zoomed, that height is --kb-h, which
   * styles.css takes off --app-h, so the shell (and the chat composer at
   * its bottom) ends where the keyboard begins. Where the keyboard
   * resizes the page instead, the two heights stay equal and this sets
   * nothing. Plain script, in <head>: before the first paint. */
  (function () {
    var vv = window.visualViewport;
    if (!vv) return;
    var root = document.documentElement;
    var last = 0;
    function typing() {
      var el = document.activeElement;
      if (!el) return false;
      if (el.isContentEditable || el.tagName === 'TEXTAREA') return true;
      return el.tagName === 'INPUT' &&
        !/^(button|checkbox|color|file|hidden|image|radio|range|reset|submit)$/i.test(el.type || '');
    }
    function sync() {
      var kb = Math.round(window.innerHeight - vv.height);
      if (!(kb > 80 && typing() && Math.abs(vv.scale - 1) < 0.01)) kb = 0;
      if (kb === last) return;
      last = kb;
      if (kb) root.style.setProperty('--kb-h', kb + 'px');
      else root.style.removeProperty('--kb-h');
      // The browser may have scrolled the window to reach the field; the
      // shell now fits above the keyboard, so put it back at the top.
      if (kb && window.scrollY) window.scrollTo(0, 0);
    }
    vv.addEventListener('resize', sync);
    window.addEventListener('focusin', sync);
    window.addEventListener('focusout', function () { setTimeout(sync, 0); });
  })();
  </script>

  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#e8a33d">
</head>
<body>

  <!-- Vendored locally under /vendor for a zero-external-request dashboard.
       Versions: react/react-dom 18.3.1 (development builds, unchanged),
       @babel/standalone 7.29.0, lucide 1.22.0 (was @latest). -->
  <script src="/vendor/react/react.development.js"></script>
  <script src="/vendor/react/react-dom.development.js"></script>

  <script type="text/babel" data-presets="react" src="chat_documents.jsx"></script>

  <!-- Files is a multi-library browser. It MUST load before doc_editor.jsx /

  <!-- Home is the default page. Loaded LAST of the core pages so every
       helper another page puts on window (satellites.jsx, calendar.jsx,
       manual.jsx) already exists when it evaluates. -->
  <script type="text/babel" data-presets="react" src="home.jsx"></script>

  <script type="text/babel" data-presets="react">
    /* ── Plugin bootstrap + app shell (design §5.2) ─────────────────────
     * Core pages register on window.DomovoiCore.pages (below). Plugin
     * pages arrive at runtime: we fetch /api/plugins/manifest, load each
     * declared script's TEXT, wrap it in an IIFE (so a duplicate
     * `const Foo` inside a plugin can't SyntaxError the shared Babel
     * scope — worst case it breaks that plugin's own IIFE), transform
     * with Babel, and execute. Pages register themselves on
     * window.DomovoiPlugins.<slug>.pages.<PageName>; routes, nav items,
     * badges and player-source kinds are all data-driven off the
     * manifest. Only THEN does the app render.
     */
    window.DomovoiCore = window.DomovoiCore || {};
    window.DomovoiCore.pages = {
      home: () => window.HomePage,
      chat: () => window.ChatPage,
      music: () => window.MusicPage,
      podcasts: () => window.PodcastsPage,
      audiobooks: () => window.AudiobooksPage,
      videos: () => window.VideosPage,
      news: () => window.NewsPage,
      people: () => window.PeoplePage,
      // A Settings tab since 2026-10-11 (Rooms since 2026-10-21): the
      // shell turns #settings/rooms into Settings → Rooms before it gets here
      // (settingsTabRoute, components.jsx). The route stays a core one, so
      // no plugin can take the old address.
      satellites: () => window.SettingsPage,
      calendar: () => window.CalendarPage,
      files: () => window.FilesPage,
      plugins: () => window.PluginsPage,
      settings: () => window.SettingsPage,
      manual: () => window.UserManualPage,
      // The container guard's details: part of Settings → Health since
      // 2026-10-21 (containers.jsx, health.jsx); the shell turns the old
      // #settings/health/containers into #settings/health/containers first. Kept a core
      // route, so no plugin can take the old address.
      containers: () => window.SettingsPage,
    };

    // Browser-side plugin error pipeline. Two sources feed it — script
    // load/transform failures (below) and page render throws (the
    // PluginErrorBoundary further down) — and the Plugins management page
    // subscribes and renders them per plugin alongside the server-side
    // errors. These are the errors the backend can NEVER see: a plugin's
    // JSX can import fine on the server yet throw in the user's browser.
    window.DomovoiPluginErrors = window.DomovoiPluginErrors || {
      _bySlug: {},
      _listeners: new Set(),
      record(slug, phase, message) {
        if (!slug) return;
        const list = this._bySlug[slug] || (this._bySlug[slug] = []);
        const msg = String(message);
        const last = list[list.length - 1];
        // Collapse repeats (a render error re-fires on every retry).
        if (last && last.phase === phase && last.message === msg) {
          last.count += 1;
        } else {
          list.push({ phase, message: msg, count: 1 });
          if (list.length > 20) list.shift();
        }
        this._listeners.forEach((fn) => { try { fn(); } catch (_) {} });
      },
      for(slug) { return this._bySlug[slug] || []; },
      clear(slug) {
        delete this._bySlug[slug];
        this._listeners.forEach((fn) => { try { fn(); } catch (_) {} });
      },
      subscribe(fn) { this._listeners.add(fn); return () => this._listeners.delete(fn); },
    };

    const loadPluginScripts = async (manifest) => {
      window.DomovoiPlugins = window.DomovoiPlugins || {};
      const errors = {};
      // Plugin code runs in this origin, so it only ever comes from a
      // server the user confirmed in the switcher (FE-2). Same-origin is
      // trusted by construction; a selected server that somehow is not
      // (storage edited by hand) gets its core pages and nothing else.
      if (!ServerStore.isTrusted(ServerStore.current())) {
        console.warn('selected server is not trusted — plugin pages skipped:', ServerStore.current());
        return errors;
      }
      for (const plugin of manifest.plugins || []) {
        for (const url of plugin.scripts || []) {
          try {
            // `no-cache`, not a bare fetch. A plugin upgrade changes these
            // files WITHOUT changing their names — the manifest an author
            // writes has no version in it — so a default fetch is answered
            // from the browser's own cache and the upgraded panel never
            // runs. The server sends no-cache too (plugin_host.py), and
            // this holds even against a box that predates that.
            const r = await fetch(url.startsWith('http') ? url : `${API_BASE}${url}`,
                                  { cache: 'no-cache' });
            if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
            const src = await r.text();
            const wrapped = `(function(){\n${src}\n})();`;
            const out = Babel.transform(wrapped, { presets: ['react'] });
            new Function(out.code)();           // isolated function scope
          } catch (e) {
            console.warn(`plugin ${plugin.slug}: script ${url} failed:`, e);
            errors[plugin.slug] = String(e.message || e);
            window.DomovoiPluginErrors.record(plugin.slug, 'load', e.message || e);
          }
        }
      }
      return errors;
    };

    const bootstrap = async () => {
      // Introduce this browser to the server (id + a seeded name) so room
      // queues can say "added by <device>" and a shared screen learns it
      // is one. Only a browser that CAN register does (paired, signed in,
      // or an unclaimed box), and again once a credential arrives: an
      // unpaired guest phone landing on Home sends nothing and sees no
      // prompt. Not awaited and never fatal — the dashboard renders
      // unnamed, queue entries just carry no tag.
      // Who is this browser? Asked at once, beside the manifest, and waited
      // for before the first render: inside the reload window (default an
      // hour after the admin password was entered here) it also takes the
      // admin sign-in back from the session cookie (auth.js resume), so a
      // reload renders signed in, with no "view only" and no sign-in prompt
      // flashing first. Capped, so a slow answer never holds the shell.
      const authReady = (typeof Auth !== 'undefined' && Auth.ready)
        ? Promise.race([Auth.ready(), new Promise((resolve) => setTimeout(resolve, 4000))])
        : Promise.resolve();
      DeviceIdentity.boot();

      let manifest = { plugins: [], core_nav: {} };
      try {
        manifest = await apiGet('/api/plugins/manifest');
      } catch (e) {
        console.warn('plugin manifest unavailable — core pages only:', e);
      }
      const scriptErrors = await loadPluginScripts(manifest);
      window.DomovoiPluginManifest = manifest;
      window.DomovoiPluginScriptErrors = scriptErrors;
      window.DomovoiPlayerSources = window.DomovoiPlayerSources || {};
      // Seed the browser player's source registry (player.jsx reads it
      // to resolve queue-item kinds → stream URLs; unknown kinds are
      // hidden with a console warn, never a crash).
      (manifest.plugins || []).forEach((p) => {
        (p.player_sources || []).forEach((src) => {
          window.DomovoiPlayerSources[src.kind] = {
            plugin: p.slug,
            stream_url_template: src.stream_url_template,
          };
        });
      });
      try { await authReady; } catch { /* never fatal: render as the status says */ }
      renderApp();
    };

    const pluginPage = (slug, pageName) => {
      const reg = (window.DomovoiPlugins || {})[slug];
      return reg && reg.pages && reg.pages[pageName];
    };

    // Catches a page that throws during render so one bad plugin page can't
    // white-screen the whole dashboard. When the failing page belongs to a
    // plugin, the error is pushed into the browser-side pipeline so it shows
    // up on the Plugins page. Resets on navigation (routeKey) so a transient
    // failure on one route doesn't wedge the others.
    class PluginErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      componentDidCatch(error, info) {
        const msg = (error && error.message) || String(error);
        if (this.props.slug) {
          window.DomovoiPluginErrors.record(this.props.slug, 'render', msg);
        } else {
          console.error('page render error:', error, info);
        }
      }
      componentDidUpdate(prev) {
        if (prev.routeKey !== this.props.routeKey && this.state.error) {
          this.setState({ error: null });
        }
      }
      render() {
        if (this.state.error) {
          const who = this.props.slug ? `The “${this.props.slug}” plugin page` : 'This page';
          return (
            <div style={{ margin: 24, padding: 20, border: '1px solid var(--border)',
                          borderRadius: 'var(--r-md)', background: 'var(--overlay)', maxWidth: 640 }}>
              <div style={{ fontWeight: 600, marginBottom: 6 }}>{who} hit an error and was stopped.</div>
              <div className="mono" style={{ fontSize: 12, color: 'var(--err-ink)', whiteSpace: 'pre-wrap' }}>
                {(this.state.error && this.state.error.message) || String(this.state.error)}
              </div>
              <div style={{ fontSize: 12, color: 'var(--fg-muted)', marginTop: 8 }}>
                The rest of the dashboard still works.
                {this.props.slug && <> See the <a href="#plugins">Plugins</a> page for this plugin's errors.</>}
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const App = () => {
      const initialTheme = document.documentElement.getAttribute('data-theme')
        || localStorage.getItem('domovoi-theme') || 'light';
      // Home is where a bare URL, the installed app (manifest start_url)
      // and an unknown route all land. Deep links (#music, …) still work,
      // and a page that became a Settings tab (#settings/rooms) opens that tab
      // (settingsTabRoute, components.jsx). `route` is the whole address
      // (#settings/advanced): its first segment picks the page, the
      // rest is the page's own (a tab, useRouteTab in components.jsx).
      const initialRoute = (window.location.hash || '#home').slice(1);
      const [theme, setThemeState] = React.useState(initialTheme);
      const [route, setRouteState] = React.useState(() => settingsTabRoute(initialRoute));

      const setTheme = (t) => {
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem('domovoi-theme', t);
        setThemeState(t);
      };
      const setRoute = (r) => {
        const to = settingsTabRoute(r);
        window.location.hash = to;
        setRouteState(to);
      };

      React.useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        const handler = () => setRouteState(settingsTabRoute((window.location.hash || '#home').slice(1)));
        window.addEventListener('hashchange', handler);
        return () => window.removeEventListener('hashchange', handler);
      }, []);

      // A plugins.changed push means the manifest is stale (new pages,
      // dropped pages). Loaded plugin code can't be re-imported into a
      // running page — show the reload toast instead (§3.2 step 15).
      const [pluginsStale, setPluginsStale] = React.useState(false);
      useStateEvents(['plugins.changed'], () => setPluginsStale(true));

      // Re-render Lucide icons whenever route changes — Babel-in-browser
      // creates fresh <i data-lucide> elements that lucide.createIcons
      // needs to convert to inline SVG.
      React.useEffect(() => {
        const t = setTimeout(() => window.lucide && window.lucide.createIcons({
          attrs: { 'stroke-width': 1.5 }
        }), 0);
        return () => clearTimeout(t);
      });

      // The page the address opens: its first segment (#settings/models →
      // settings). Everything below picks pages, nav and crumbs by it.
      const page = routePage(route);

      // A new page starts at its top. .main is the one scroller every page
      // shares, so a tab tapped from a page scrolled halfway down used to
      // open halfway down too (Music scrolled 600px -> Home at 865px). A
      // tab of the same page (#music/queue) keeps the scroll: Music's tabs
      // sit below every room card.
      const mainRef = React.useRef(null);
      React.useLayoutEffect(() => {
        if (mainRef.current) mainRef.current.scrollTop = 0;
      }, [page]);

      const counts = useSidebarCounts();
      const manifest = window.DomovoiPluginManifest || { plugins: [] };
      // Plugin nav badges, polled ONCE for the sidebar (the phone strip is
      // the same element) and Home's "everything" grid alike.
      const badges = usePluginBadges(manifest);

      // Route map: core routes + manifest-declared plugin pages.
      let Page = null;
      let pageSlug = null;   // set only when the resolved page belongs to a plugin
      let pagePlugin = null; // ... and then its manifest entry and page (the frame)
      let pageDecl = null;
      const coreGetter = window.DomovoiCore.pages[page];
      if (coreGetter) Page = coreGetter();
      if (!Page) {
        for (const p of manifest.plugins || []) {
          for (const pg of p.pages || []) {
            if (pg.route === page) {
              const P = pluginPage(p.slug, pg.page);
              if (P) { Page = P; pageSlug = p.slug; pagePlugin = p; pageDecl = pg; }
            }
          }
        }
      }
      // Unknown route → Home. Music only if Home itself failed to register
      // (a script error in home.jsx must not leave the shell with no page).
      // The crumb and the nav then name the page that is showing, not the
      // unknown route ("domovoi / " with nothing after it).
      let shownRoute = page;
      if (!Page) {
        Page = window.DomovoiCore.pages.home() || window.DomovoiCore.pages.music();
        shownRoute = window.DomovoiCore.pages.home() ? 'home' : 'music';
      }

      return (
        <PlaybackProvider>
          <div className="app" data-screen-label={`Domovoi · ${shownRoute}`}>
            <Sidebar route={shownRoute} setRoute={setRoute} counts={counts} manifest={manifest} badges={badges}/>
            <Topbar route={shownRoute} setRoute={setRoute} theme={theme} setTheme={setTheme}/>
            <main className="main" ref={mainRef}>
              {/* `counts` and `badges` are the ONE useSidebarCounts and
                  usePluginBadges results, handed down so Home's
                  "everything" grid can badge its tiles without repeating
                  the sidebar's fetches. Other pages ignore them. */}
              {/* The container guard's banner, on every page while an
                  incident is open (components.jsx). */}
              <ContainerGuardBanner/>
              {/* A household token this server refused, or its "wait"
                  after wrong ones: said once, here (components.jsx). */}
              <DeviceTokenNotice/>
              {/* A plugin's page sits in the plugin frame (components.jsx
                  PluginPageFrame): its name, publisher and a link to its
                  Plugins row above it, and its own accent in place of
                  Domovoi's amber inside it. Core pages never get one. The
                  frame stays when the page throws, so the error reads as
                  the plugin's. */}
              {pagePlugin ? (
                <PluginPageFrame key={pageSlug} plugin={pagePlugin} page={pageDecl}>
                  <PluginErrorBoundary slug={pageSlug} routeKey={route}><Page counts={counts} badges={badges}/></PluginErrorBoundary>
                </PluginPageFrame>
              ) : (
                <PluginErrorBoundary slug={pageSlug} routeKey={route}><Page counts={counts} badges={badges}/></PluginErrorBoundary>
              )}
            </main>
            <AuthModalHost/>
            {/* Help (help.jsx): the "?" and "ask Domovoi about this" panel. */}
            {window.HelpHost && <window.HelpHost/>}
            {/* A timer or reminder went off somewhere in the house: a card
                that stays until dismissed (components.jsx). */}
            <TimerFireAlerts/>
            {pluginsStale && (
              <div style={{ position: 'fixed', bottom: 'calc(var(--dock-bottom, 0px) + var(--player-h, 0px) + 24px)', right: 24, zIndex: 80,
                            background: 'var(--overlay)', border: '1px solid var(--border)',
                            borderRadius: 'var(--r-md)', boxShadow: 'var(--shadow-md)',
                            padding: '10px 14px', fontSize: 13, display: 'flex',
                            alignItems: 'center', gap: 10 }}>
                plugins changed — reload to get the new pages
                <Button variant="primary" onClick={() => window.location.reload()}>reload</Button>
              </div>
            )}
          </div>
        </PlaybackProvider>
      );
    };

    const renderApp = () =>
      ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

    bootstrap();
  </script>

  <!-- Is this tab running the files the box is serving?
   *
   * The one staleness no cache header can ever reach. Headers govern the
   * NEXT request; a tab that finished loading has stopped making any, so a
   * dashboard left open on the kitchen tablet goes on running last week's
   * bundle for as long as nobody closes it, and nothing tells anyone. That
   * is precisely how a deployed fix gets reported as "did not work".
   *
   * web/backend/static_cache.py stamps the page it sends with a digest of
   * exactly those bytes; GET /api/bundle reports the digest of what the box
   * would send now. Different means this tab is behind.
   *
   * Plain <script>, not type="text/babel", and plain DOM, not React: the
   * whole point is to still speak up on a page whose own bundle is old
   * enough to be broken. If anything here is missing - no marker (served by
   * something that does not stamp), no /api/bundle (an older box), no
   * answer at all - it says nothing rather than guessing.
   *
   * It does NOT rescue a browser still holding a page from before this
   * release: that page has no marker in it, because the marker ships inside
   * the file that is not arriving. Those browsers need one ordinary reload,
   * once. See the release notes.
   -->
  <script>
  (function () {
    var mine = window.__DOMOVOI_BUNDLE__;
    if (!mine || !window.fetch) return;

    var IDLE_MS = 10 * 60 * 1000;   // a pinned tab nobody touches
    var FOCUS_GAP_MS = 60 * 1000;   // tab-switching must not become polling
    var FIRST_MS = 20 * 1000;       // let the dashboard finish booting first
    var last = 0;
    var done = false;

    function show() {
      if (done || document.getElementById('bundle-stale')) return;
      done = true;
      var bar = document.createElement('div');
      bar.id = 'bundle-stale';
      bar.setAttribute('role', 'status');
      // --dock-bottom: above the phone's tab strip (0 on a desktop);
      // --player-h: above the docked player while one shows.
      bar.style.cssText = 'position:fixed;left:24px;bottom:calc(var(--dock-bottom, 0px) + var(--player-h, 0px) + 24px);z-index:120;' +
        'max-width:min(420px,calc(100vw - 48px));background:var(--overlay,#222);' +
        'color:var(--fg,#eee);border:1px solid var(--border,#444);' +
        'border-radius:var(--r-md,10px);box-shadow:var(--shadow-md,0 6px 24px rgba(0,0,0,.35));' +
        'padding:12px 14px;font-size:13px;line-height:1.45;display:flex;' +
        'flex-wrap:wrap;align-items:center;gap:10px;';
      var text = document.createElement('span');
      text.style.cssText = 'flex:1 1 200px;';
      text.textContent = 'Domovoi has been updated. This tab is still running the ' +
        'dashboard files it opened with \u2014 reload to pick up the new ones.';
      var reload = document.createElement('button');
      reload.type = 'button';
      reload.textContent = 'reload';
      reload.style.cssText = 'cursor:pointer;border-radius:var(--r-sm,8px);' +
        'border:1px solid var(--brand,#e8a33d);background:var(--brand,#e8a33d);' +
        'color:var(--brand-fg,#1b1b1b);padding:6px 12px;font:inherit;font-weight:600;';
      reload.addEventListener('click', function () { window.location.reload(); });
      var later = document.createElement('button');
      later.type = 'button';
      later.textContent = 'not now';
      later.style.cssText = 'cursor:pointer;border-radius:var(--r-sm,8px);' +
        'border:1px solid var(--border,#444);background:transparent;color:inherit;' +
        'padding:6px 12px;font:inherit;';
      later.addEventListener('click', function () { bar.remove(); });
      bar.appendChild(text);
      bar.appendChild(reload);
      bar.appendChild(later);
      document.body.appendChild(bar);
    }

    function check() {
      if (done) return;
      last = Date.now();
      // no-store, so this question is never answered by the cache that is
      // the subject of the question.
      fetch('/api/bundle', { cache: 'no-store', credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { if (d && d.bundle && d.bundle !== mine) show(); })
        .catch(function () { /* offline, or a box without the route */ });
    }

    setTimeout(check, FIRST_MS);
    setInterval(check, IDLE_MS);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && Date.now() - last > FOCUS_GAP_MS) check();
    });
  })();
  </script>
</body>
</html>
