# Every Python package the trainer image's pip installs bring in, pinned
# and hashed: the Dockerfile installs this file with `pip install
# --require-hashes` (OpenSSF Scorecard's Pinned-Dependencies), then
# openWakeWord itself with --no-deps.
#
# The set is what pip installs on top of the pinned pytorch/pytorch base
# for the Dockerfile's packages (a `pip install --dry-run --ignore-installed
# --report` on that base, 2026-11-20), at the versions the 2026-10-13
# spike trained with: torch, torchaudio and the CUDA wheels come with the
# base and are never installed here. A few lines (PyYAML, requests,
# urllib3, packaging and their kin) are the base's own versions, already
# installed there, so pip leaves them alone; they are listed for a base
# without them (the CPU/arm BASE build-arg, after torch-cpu.lock). Where
# the base's own copy has a known advisory (certifi, pillow, filelock,
# setuptools), the line here is a fixed version, so pip replaces it. numpy
# stays at 2.1.1: scipy 1.14 (see the Dockerfile) needs numpy < 2.3.
# Hashes: every file PyPI has for each version, so any platform's wheel
# checks. .github/workflows/osv.yml fails on any advisory in this file.
#
# To move a pin: change the version, take that version's sha256 values from
# its PyPI page (Download files) or `pip hash`, rebuild, train once. A new
# package needs its whole dependency closure listed, or the build stops
# with "Hashes are required in --require-hashes mode".
