# Every Python package the trainer image's pip installs bring in, pinned
# and hashed: the Dockerfile installs this file with `pip install
# --require-hashes` (OpenSSF Scorecard's Pinned-Dependencies), then
# openWakeWord itself with --no-deps.
#
# The set is what pip installs on top of the pinned pytorch/pytorch base
# for the Dockerfile's packages (a `pip install --dry-run --report` on that
# base, 2026-11-19), at the versions the 2026-10-13 spike trained with:
# torch, torchaudio and the CUDA wheels come with the base and are never
# installed here. A few lines (numpy, PyYAML, requests, tqdm, pillow and
# their kin) are the base's own versions, already installed there, so pip
# leaves them alone; they are listed for a base without them (the CPU/arm
# BASE build-arg, after torch-cpu.lock). Hashes: every file PyPI has for
# each version, so any platform's wheel checks.
#
# To move a pin: change the version, take that version's sha256 values from
# its PyPI page (Download files) or `pip hash`, rebuild, train once. A new
# package needs its whole dependency closure listed, or the build stops
# with "Hashes are required in --require-hashes mode".
