# Pins for scripts/linux/provision.sh that have no other home in the repo.
#
# Everything the repository already pins is read from the checkout at the
# commit being installed, never copied here: the Python packages
# (requirements-linux-py314.lock), the compose images (domovoi/docker-compose.yml),
# the MPD image's base (domovoi/Dockerfile.mpd), the Piper voices
# (PIPER_PINS in domovoi/clients/tts.py) and the Ollama release
# (OLLAMA_VERSION / OLLAMA_SHA256 in docs/LINUX_HOST.md, "Install").
#
# Format: one key=value per line, no spaces, no quotes; # starts a comment
# line. provision.sh reads this file from the checkout it just cloned, so the
# pins always belong to the code they install. Every key below is required;
# an unknown key, a missing one or a malformed value stops the run.

manifest_version=1

# ─── Docker Engine (docker-ce) from Docker's apt repository ──────────────
# https://docs.docker.com/engine/install/ubuntu/ ("Install using the apt
# repository"). The key's primary fingerprint was read with
# `gpg --show-keys` on docker_key_url on 2026-09-25 (signing subkey
# D3306A018370199E527AE7997EA0A9C3F273FCD8); apt then checks every .deb
# against the index that key signs; provision.sh installs that key alone
# (gpg --export of this fingerprint), and refuses a key file holding any
# other primary key. The package versions are the resolute (26.04) builds
# listed in dists/resolute/stable/binary-amd64/Packages on 2026-09-25
# (windows-installer PLAN.md 4.13). provision.sh installs exactly these on
# a box that has no docker-ce yet, and does not hold them: as on the
# Beelink, an ordinary apt upgrade moves them later, and a re-run never
# takes them back down. A new pin is a new commit (and only matters for new
# installs).
docker_key_url=https://download.docker.com/linux/ubuntu/gpg
docker_key_fpr=9DC858229FC7DD38854AE2D88D81803C0EBFCD88
docker_repo_url=https://download.docker.com/linux/ubuntu
docker_suite=resolute
docker_ce=5:29.8.1-1~ubuntu.26.04~resolute
docker_ce_cli=5:29.8.1-1~ubuntu.26.04~resolute
containerd_io=2.3.5-1~ubuntu.26.04~resolute
docker_buildx_plugin=0.37.1-1~ubuntu.26.04~resolute
docker_compose_plugin=5.5.1-1~ubuntu.26.04~resolute

# ─── Whisper (faster-whisper CTranslate2 model) ──────────────────────────
# Systran/faster-whisper-small.en at a fixed Hugging Face commit, read from
# huggingface.co/api/models/Systran/faster-whisper-small.en (sha) and its
# /tree/main (model.bin's LFS oid, which is its SHA-256) on 2026-09-25.
# Downloaded at that revision only, so the cache holds one snapshot and no
# refs/main; the core then loads that snapshot by path
# (domovoi/clients/whisper.py, pinned_snapshot_dir).
whisper_model=small.en
whisper_repo=Systran/faster-whisper-small.en
whisper_revision=d1d751a5f8271d482d14ca55d9e2deeebbae577f
whisper_model_bin_sha256=62b2a45b05ee59acb4a5341b33ee35e041395d378d418a18acfe4c9e768ee37a
whisper_model_bin_bytes=483545366

# ─── Hardware tiers (windows-installer PLAN.md 4.9 and 8) ────────────────
# --tier auto picks "standard" when the box's MemTotal is at least this
# many MiB, else "floor". MemTotal is what the kernel can use: on a WSL
# host it is the VM's cap, not the PC's RAM, and a 24 GB box reads about
# 23.3 GiB, so the line sits at 22 GiB.
tier_standard_min_mem_mib=22528
# Ollama models by exact tag, each checked after the pull against the
# manifest digest the registry served on 2026-09-24 (what /api/tags reports
# as "digest"). Never a bare tag: Ollama retargets those. The floor tier's
# router is UNMEASURED until spike S5.
tier_floor_tool_model=qwen3:4b-instruct-2507-q4_K_M
tier_floor_tool_digest=0edcdef34593eac1aa2be9c7d06c432dcf81945adca5eca2f27662c18f168ba0
tier_floor_qa_model=llama3.2:3b-instruct-q4_K_M
tier_floor_qa_digest=a80c4f17acd55265feec403c7aef86be0c25983ab279d83f3bcd3abbcb5b8b72
tier_standard_tool_model=qwen3:8b-q4_K_M
tier_standard_tool_digest=500a1f067a9f782620b40bee6f7b0c89e17ae61f686b92c24933e4ca4b2b8b41
tier_standard_qa_model=llama3.2:3b-instruct-q4_K_M
tier_standard_qa_digest=a80c4f17acd55265feec403c7aef86be0c25983ab279d83f3bcd3abbcb5b8b72
