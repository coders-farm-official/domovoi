# Pins for scripts/linux/provision.sh that have no other home in the repo.
#
# Everything the repository already pins is read from the checkout at the
# commit being installed, never copied here: the Python packages
# (requirements-linux-py314.lock), the compose images (domovoi/docker-compose.yml),
# the MPD image's base (domovoi/Dockerfile.mpd), the Piper voices
# (SHIPPED_VOICES / PIPER_PINS in domovoi/clients/tts.py: the three
# public-domain voices, norman, kristin and ljspeech, at rhasspy/piper-voices
# revision c10ece1aade47bb51c153c893d14e5bf8e5b7117, each .onnx by SHA-256
# and each .onnx.json by its git blob id; provision.sh fetches all three
# and checks each against its pin) and the Ollama release
# (OLLAMA_VERSION / OLLAMA_SHA256 in docs/LINUX_HOST.md, "Install").
#
# Format: one key=value per line, no spaces, no quotes; # starts a comment
# line. provision.sh reads this file from the checkout it just cloned, so the
# pins always belong to the code they install. Every key below is required;
# an unknown key, a missing one or a malformed value stops the run.

manifest_version=1

# ─── Docker Engine (docker-ce) from Docker's apt repository ──────────────
# (Ubuntu 26.04 first; the Debian 13 and Ubuntu 24.04 pins follow it.)
# https://docs.docker.com/engine/install/ubuntu/ ("Install using the apt
# repository"). The key's primary fingerprint was read with
# `gpg --show-keys` on docker_key_url on 2026-09-25 (signing subkey
# D3306A018370199E527AE7997EA0A9C3F273FCD8); apt then checks every .deb
# against the index that key signs; provision.sh installs that key alone
# (gpg --export of this fingerprint), and refuses a key file holding any
# other primary key. The package versions are the resolute (26.04) builds
# listed in dists/resolute/stable/binary-amd64/Packages on 2026-09-25
# (windows-installer PLAN.md 4.13). provision.sh installs exactly these on
# a box that has no docker-ce yet, and does not hold them: as on the
# Beelink, an ordinary apt upgrade moves them later, and a re-run never
# takes them back down. A new pin is a new commit (and only matters for new
# installs).
docker_key_url=https://download.docker.com/linux/ubuntu/gpg
docker_key_fpr=9DC858229FC7DD38854AE2D88D81803C0EBFCD88
docker_repo_url=https://download.docker.com/linux/ubuntu
docker_suite=resolute
docker_ce=5:29.8.1-1~ubuntu.26.04~resolute
docker_ce_cli=5:29.8.1-1~ubuntu.26.04~resolute
containerd_io=2.3.5-1~ubuntu.26.04~resolute
docker_buildx_plugin=0.37.1-1~ubuntu.26.04~resolute
docker_compose_plugin=5.5.1-1~ubuntu.26.04~resolute
# The same Docker Engine release for the other systems provision.sh
# installs on (docs/LINUX_HOST.md, Which distro): Debian 13 (trixie), from
# Docker's Debian repository, and Ubuntu 24.04 (noble), the base of Linux
# Mint 22 and Pop!_OS 24.04, from the Ubuntu one. One key for all of them:
# linux/debian/gpg is the same file as linux/ubuntu/gpg (fingerprint above,
# compared on 2026-11-15). The versions are the trixie and noble builds in
# dists/<suite>/stable/binary-amd64/Packages on 2026-11-15, the same
# upstream releases as the resolute pins. provision.sh picks the suite from
# /etc/os-release (VERSION_CODENAME; UBUNTU_CODENAME on a derivative).
docker_debian_key_url=https://download.docker.com/linux/debian/gpg
docker_debian_repo_url=https://download.docker.com/linux/debian
docker_trixie_ce=5:29.8.1-1~debian.13~trixie
docker_trixie_ce_cli=5:29.8.1-1~debian.13~trixie
docker_trixie_containerd_io=2.3.5-1~debian.13~trixie
docker_trixie_buildx_plugin=0.37.1-1~debian.13~trixie
docker_trixie_compose_plugin=5.5.1-1~debian.13~trixie
docker_noble_ce=5:29.8.1-1~ubuntu.24.04~noble
docker_noble_ce_cli=5:29.8.1-1~ubuntu.24.04~noble
docker_noble_containerd_io=2.3.5-1~ubuntu.24.04~noble
docker_noble_buildx_plugin=0.37.1-1~ubuntu.24.04~noble
docker_noble_compose_plugin=5.5.1-1~ubuntu.24.04~noble

# ─── Python, where the system's python3 is not the lock's ────────────────
# requirements-linux-py314.lock is for CPython 3.14, Ubuntu 26.04's own
# python3, which a box on it keeps using (nothing below is downloaded
# there). Elsewhere (Debian 13 ships 3.13, Ubuntu 24.04 and its derivatives
# 3.12) provision.sh's venv step installs this CPython (scripts/linux/
# python-runtime.sh) and builds the venv from it. Both downloads are pinned
# by version and SHA-256 and checked before anything in them runs:
#   uv (MIT OR Apache-2.0), the installer, uv-x86_64-unknown-linux-gnu.tar.gz
#   of github.com/astral-sh/uv release uv_version, SHA-256 as GitHub's
#   release API reported it (assets[].digest) on 2026-11-15;
#   CPython (PSF-2.0) as python-build-standalone (MIT, the build scripts)
#   builds it: cpython-<python_version>+<python_build>-x86_64-unknown-
#   linux-gnu-install_only_stripped.tar.gz of release python_build, the
#   SHA-256 the same API reported, which is also the one uv uv_version
#   carries for that file (crates/uv-python-managed/download-metadata.json),
#   so uv checks it a second time as it installs it.
# Installed under /usr/local/lib/domovoi-python, root's. A new pin is a new
# commit: the next provision.sh run installs it beside the old one and moves
# the venv over (python -m venv --upgrade, same 3.14), and so does a
# dashboard update that brings it (apply-update.sh, step 4b).
uv_version=0.13.6
uv_sha256=f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
python_version=3.14.10
python_build=20261026
python_sha256=4d3c16c59ed0802a3d1d34d8bce504b15ceeaff39d62dadecc6a9fa803412aed

# ─── NVIDIA Container Toolkit from NVIDIA's apt repository ───────────────
# Docker's way to an NVIDIA GPU (--gpus), for the wake-word trainer's
# container. Read by scripts/linux/gpu-runtime.sh, which provision.sh's
# gpu-runtime step and apply-update.sh (every update or restart the update
# unit runs) call, and which installs anything ONLY when an NVIDIA GPU is
# visible (WSL: /dev/dxg and /usr/lib/wsl/lib/libcuda.so.1; bare metal: the
# driver's nvidia-smi); never a driver. An OS package from NVIDIA's
# repository, Apache-2.0, not bundled with Domovoi.
# https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
# (the apt way: a flat repository, "deb [signed-by=...] <url> /"). The key
# at nvidia_key_url held exactly one primary key on 2026-10-13, this
# fingerprint (its old signing subkey is expired; apt verifies the index
# all the same); gpu-runtime.sh installs that key alone and refuses a key
# file holding any other primary key. The four packages are what
# `apt-get install --no-install-recommends nvidia-container-toolkit` pulled
# on Ubuntu 26.04 with Docker Engine 29.8.1 on 2026-10-13 (none depends on
# a driver), all at 1.20.1-1, tested with --gpus all and torch on CUDA. As
# with docker-ce: installed at these versions when missing, not held (apt
# upgrade moves them later), and a re-run never takes them back down.
nvidia_key_url=https://nvidia.github.io/libnvidia-container/gpgkey
nvidia_key_fpr=C95B321B61E88C1809C4F759DDCAE044F796ECB0
nvidia_repo_url=https://nvidia.github.io/libnvidia-container/stable/deb/amd64
nvidia_container_toolkit=1.20.1-1
nvidia_container_toolkit_base=1.20.1-1
libnvidia_container_tools=1.20.1-1
libnvidia_container1=1.20.1-1

# ─── Whisper (faster-whisper CTranslate2 model) ──────────────────────────
# Systran/faster-whisper-small.en at a fixed Hugging Face commit, read from
# huggingface.co/api/models/Systran/faster-whisper-small.en (sha) and its
# /tree/main (model.bin's LFS oid, which is its SHA-256) on 2026-09-25.
# Downloaded at that revision only, so the cache holds one snapshot and no
# refs/main; the core then loads that snapshot by path
# (domovoi/clients/whisper.py, pinned_snapshot_dir).
whisper_model=small.en
whisper_repo=Systran/faster-whisper-small.en
whisper_revision=d1d751a5f8271d482d14ca55d9e2deeebbae577f
whisper_model_bin_sha256=62b2a45b05ee59acb4a5341b33ee35e041395d378d418a18acfe4c9e768ee37a
whisper_model_bin_bytes=483545366

# ─── Hardware tiers (windows-installer PLAN.md 4.9 and 8) ────────────────
# --tier auto picks "standard" when the box's MemTotal is at least this
# many MiB, else "floor". MemTotal is what the kernel can use: on a WSL
# host it is the VM's cap, not the PC's RAM, and a 24 GB box reads about
# 23.3 GiB, so the line sits at 22 GiB.
tier_standard_min_mem_mib=22528
# Ollama models by exact tag, each checked after the pull against the
# manifest digest the registry served on 2026-09-24 (what /api/tags reports
# as "digest"). Never a bare tag: Ollama retargets those. The floor tier's
# router is UNMEASURED until spike S5.
tier_floor_tool_model=qwen3:4b-instruct-2507-q4_K_M
tier_floor_tool_digest=0edcdef34593eac1aa2be9c7d06c432dcf81945adca5eca2f27662c18f168ba0
tier_floor_qa_model=llama3.2:3b-instruct-q4_K_M
tier_floor_qa_digest=a80c4f17acd55265feec403c7aef86be0c25983ab279d83f3bcd3abbcb5b8b72
tier_standard_tool_model=qwen3:8b-q4_K_M
tier_standard_tool_digest=500a1f067a9f782620b40bee6f7b0c89e17ae61f686b92c24933e4ca4b2b8b41
tier_standard_qa_model=llama3.2:3b-instruct-q4_K_M
tier_standard_qa_digest=a80c4f17acd55265feec403c7aef86be0c25983ab279d83f3bcd3abbcb5b8b72
# The vision model (pictures in the dashboard's and the app's chat), written
# as OLLAMA_VISION_MODEL and pulled unless --no-vision-model (1.93 GB).
# Qwen3-VL 2B Instruct, Apache-2.0 (Qwen/Qwen3-VL-2B-Instruct model card),
# picked for boxes without a GPU from a CPU benchmark of ten vision models
# on 2026-10-11/12 (owner decision 2026-10-12): ~3.2 GB in memory, reads
# screenshots, receipts and charts at the 1280 px the chat sends. Digest
# as Ollama's registry served it on 2026-10-30: the build of 2026-10-11
# (ea422f...) was re-published under the same tag as a llama.cpp-runner
# build (afc393..., "runner":"llamacpp": a 1.11 GB model plus a separate
# 0.82 GB projector), checked to read a picture on the pinned Ollama 0.34.4,
# on Apple Silicon too (100% Metal). A digest that differs after the pull
# does not stop the run for this model alone: provision.sh removes it and
# finishes without pictures in chat (do_models). The -instruct tag: the
# bare qwen3-vl tags are the thinking builds. Both tiers: the 4B (3.30 GB,
# ~4.6 GB in memory, ~1.5x slower) is an opt-in in Settings, Models.
tier_floor_vision_model=qwen3-vl:2b-instruct-q4_K_M
tier_floor_vision_digest=afc393e3572c07db0bc84aa460d928a16c75f3fbb9ca9e0dccc4fbd2dafb573e
tier_standard_vision_model=qwen3-vl:2b-instruct-q4_K_M
tier_standard_vision_digest=afc393e3572c07db0bc84aa460d928a16c75f3fbb9ca9e0dccc4fbd2dafb573e
