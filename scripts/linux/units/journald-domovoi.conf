# /etc/systemd/journald.conf.d/50-domovoi.conf, installed by
# scripts/linux/provision.sh and scripts/linux/apply-update.sh
# (docs/LINUX_HOST.md, "The loop watchdog").
#
# The journal is where the core says why it stopped: a crash, or its loop
# watchdog's report with every thread's stack. Kept in RAM only, as some
# installs do, a power cycle erases it, and on 2026-10-14 that is how the
# record of a frozen core was lost. Kept on disk here, at most 1 GB of it.
# To decide this yourself, put your own drop-in after this one (a name
# that sorts later, such as 90-local.conf), or set DOMOVOI_MANAGE_JOURNAL=0
# in /etc/default/domovoi-update and delete this file.
[Journal]
Storage=persistent
SystemMaxUse=1G
