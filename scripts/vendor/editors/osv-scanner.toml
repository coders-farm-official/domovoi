# Accepted vulnerabilities for package-lock.json beside this file: the pinned
# sources of the Documents editor bundles (web/static/vendor/tiptap, yjs,
# mammoth). OSV-Scanner, and OpenSSF Scorecard's Vulnerabilities check which
# runs it, read the osv-scanner.toml in a lock file's own folder, not the
# repo root's, so the entries for this lock live here. Same rules as the root
# osv-scanner.toml: a reason, and an expiry at most about two months out.

[[IgnoredVulns]]
id = "GHSA-cp6q-959q-f8rh"
ignoreUntil = 2027-01-15
reason = """@tiptap/core mergeAttributes() lets an object with an own __proto__ key \
replace the merged object's prototype. Only Tiptap 3.30.4 fixes it; 2.x has no fix, and \
moving the editor to Tiptap 3 is a migration (renamed extensions, collaboration caret, \
y-prosemirror), not a bump. Not reachable here: web/static/doc_editor.jsx only passes \
literal HTMLAttributes objects, its own renderHTML functions return fixed keys, and \
documents (HTML, Markdown, .docx, Yjs updates from peers) become ProseMirror nodes \
through fixed schemas, which drop any attribute the schema doesn't define, so no \
attacker-chosen key ever reaches mergeAttributes()."""
